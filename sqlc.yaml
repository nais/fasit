version: 1
packages:
  - path: "pkg/database/gensql"
    name: "gensql"
    engine: "postgresql"
    schema: "pkg/database/migrations"
    queries: "pkg/database/queries"
    emit_interface: true
    emit_empty_slices: true
    sql_package: pgx/v5
    overrides:
      - db_type: "uuid"
        go_type: "github.com/google/uuid.UUID"
    rules:
      - always-order-by
    # Might want this for v1.11
    # emit_result_struct_pointers: true

rules:
  - name: always-order-by
    rule: |
      query.cmd == ":exec"
    message: |
      SELECT statements must have an ORDER BY clause
