version: "2"
rules:
  - name: "always-order-by"
    rule: |
      query.cmd == "many" && !query.sql.contains("ORDER BY")
    message: |
      SELECT statements must have an ORDER BY clause
sql:
  - &default_domain
    name: "Deployment SQL"
    engine: "postgresql"
    schema: "internal/database/migrations"
    queries: "internal/deployment/queries"
    rules:
      - "always-order-by"
    gen:
      go: &default_go
        package: "deploymentsql"
        out: "internal/deployment/deploymentsql"
        sql_package: "pgx/v5"
        emit_interface: true
        omit_sqlc_version: true
        emit_empty_slices: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "*github.com/google/uuid.UUID"
            nullable: true
          - db_type: "environment_kind"
            go_type: "github.com/nais/fasit/internal/database/types.EnvironmentKind"
          - db_type: "environment_kind"
            go_type: "*github.com/nais/fasit/internal/database/types.EnvironmentKind"
            nullable: true
          - column: "environments.labels"
            go_type: "github.com/nais/fasit/internal/database/types.EnvironmentLabels"
          - column: "deployments.target"
            go_type: "github.com/nais/fasit/internal/database/types.EnvironmentLabels"
  - engine: "postgresql" # keep this line for Intellij formatting issues
    !!merge <<: *default_domain
    name: "Environment SQL"
    queries: "internal/environment/queries"
    gen:
      go:
        !!merge <<: *default_go
        package: "environmentsql"
        out: "internal/environment/environmentsql"
  - engine: "postgresql" # keep this line for Intellij formatting issues
    !!merge <<: *default_domain
    name: "Naisd status SQL"
    queries: "internal/naisdstatus/queries"
    gen:
      go:
        !!merge <<: *default_go
        package: "naisdstatussql"
        out: "internal/naisdstatus/naisdstatussql"
  - engine: "postgresql" # keep this line for Intellij formatting issues
    !!merge <<: *default_domain
    name: "Feature SQL"
    queries: "internal/feature/queries"
    gen:
      go:
        !!merge <<: *default_go
        package: "featuresql"
        out: "internal/feature/featuresql"
  - engine: "postgresql" # keep this line for Intellij formatting issues
    !!merge <<: *default_domain
    name: "Audit SQL"
    queries: "internal/audit/queries"
    gen:
      go:
        !!merge <<: *default_go
        package: "auditsql"
        out: "internal/audit/auditsql"
#emit_result_struct_pointers: true
#emit_prepared_queries: true
#emit_all_enum_values: true
#emit_enum_valid_method: true
#json_tags_id_uppercase: true
