syntax = "proto3";

option go_package = "internal/environmentmanagement/protogen;protogen";

service Fasit {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {}
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {}
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse) {}
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse) {}
  rpc SetEnvironmentValue(SetEnvironmentValueRequest) returns (SetEnvironmentValueResponse) {}
  rpc GetEnvironmentValue(GetEnvironmentValueRequest) returns (GetEnvironmentValueResponse) {}
  rpc ListEnvironmentValues(ListEnvironmentValuesRequest) returns (ListEnvironmentValuesResponse) {}
  rpc DeleteEnvironmentValue(DeleteEnvironmentValueRequest) returns (DeleteEnvironmentValueResponse) {}
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse) {}
}

message Tenant {
  string id = 1;
  string name = 2;
}

message Environment {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  repeated EnvironmentLabel labels = 4;
  optional string oidc_issuer = 5;
  optional string oidc_discovery_url = 6;
}

message EnvironmentLabel {
  string key = 1;
  string value = 2;
}

message EnvironmentValue {
  string environment_id = 1;
  string key = 2;
  bytes value = 3;
  bool secret = 4;
  string tenant_id = 5;
  string environment_name = 6;
  string tenant_name = 7;
}

enum EnvironmentKind {
  UNKNOWN = 0;
  MANAGEMENT = 1;
  TENANT = 2;
  ONPREM = 3;
  LEGACY = 4;
}

// CreateTenant
message CreateTenantRequest {
  string name = 1;
  optional string description = 2;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

// GetTenant
message GetTenantRequest {
  string name = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

// CreateEnvironment
message CreateEnvironmentRequest {
  string tenant_id = 1;
  string name = 2;
  EnvironmentKind kind = 3;
  repeated EnvironmentLabel labels = 4;
  optional string oidc_issuer = 5;
  optional string oidc_discovery_url = 6;
}

message CreateEnvironmentResponse {
  Environment environment = 1;
}

// GetEnvironment
message GetEnvironmentRequest {
  string tenant_id = 1;
  string name = 2;
}

message GetEnvironmentResponse {
  Environment environment = 1;
}

// SetEnvironmentValue
message SetEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
  bytes value = 3;
  bool secret = 4;
}

message SetEnvironmentValueResponse {
  bool success = 1;
}

// GetEnvironmentValue
message GetEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
}

message GetEnvironmentValueResponse {
  EnvironmentValue environment_value = 1;
}

// ListEnvironmentValues
message ListEnvironmentValuesRequest {
  string key = 1;
}

message ListEnvironmentValuesResponse {
  repeated EnvironmentValue values = 1;
}

// DeleteEnvironmentValue
message DeleteEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
}

message DeleteEnvironmentValueResponse {
  bool success = 1;
}

// UpdateEnvironment
message UpdateEnvironmentRequest {
  string environment_id = 1;
  repeated EnvironmentLabel labels = 2;
  optional string oidc_issuer = 3;
  optional string oidc_discovery_url = 4;
}

message UpdateEnvironmentResponse {
  Environment environment = 1;
}
