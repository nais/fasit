syntax = "proto3";

option go_package = "internal/provider/protogen;protogen";

service Provider {
  rpc CreateTenant(CreateTenantRequest) returns (TenantResponse) {}
  rpc GetTenant(GetTenantRequest) returns (TenantResponse) {}
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (EnvironmentResponse) {}
  rpc GetEnvironment(GetEnvironmentRequest) returns (EnvironmentResponse) {}
  rpc CreateOrUpdateEnvironmentValue(CreateOrUpdateEnvironmentValueRequest) returns (CreateOrUpdateEnvironmentValueResponse) {}
  rpc GetEnvironmentValue(GetEnvironmentValueRequest) returns (EnvironmentValueResponse) {}
  rpc GetEnvironmentValuesAcrossEnvs(GetEnvironmentValuesAcrossEnvsRequest) returns (EnvironmentValuesAcrossEnvsResponse) {}
  rpc DeleteEnvironmentValue(DeleteEnvironmentValueRequest) returns (DeleteEnvironmentValueResponse) {}
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (EnvironmentResponse) {}
}

message CreateTenantRequest {
  string name = 1;
}

message GetTenantRequest {
  string name = 1;
}

message TenantResponse {
  string id = 1;
  string name = 2;
}

message CreateEnvironmentRequest {
  string tenant_id = 1;
  string name = 2;
  EnvironmentKind kind = 3;
  repeated EnvironmentLabel labels = 4;
}

message UpdateEnvironmentRequest {
  string environment_id = 1;
  repeated EnvironmentLabel labels = 2;
}

message EnvironmentLabel {
  string key = 1;
  string value = 2;
}

message GetEnvironmentRequest {
  string tenant_id = 1;
  string name = 2;
}

message EnvironmentResponse {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  repeated EnvironmentLabel labels = 4;
}

enum EnvironmentKind {
  UNKNOWN = 0;
  MANAGEMENT = 1;
  TENANT = 2;
  ONPREM = 3;
  LEGACY = 4;
}

message CreateOrUpdateEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
  bytes value = 3;
  bool secret = 4;
}

message CreateOrUpdateEnvironmentValueResponse {
  bool success = 1;
}

message GetEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
}

message EnvironmentValueResponse {
  string environment_id = 1;
  string key = 2;
  bytes value = 3;
  bool secret = 4;
  string tenant_id = 5;
  string environment_name = 6;
  string tenant_name = 7;
}

message GetEnvironmentValuesAcrossEnvsRequest {
  string key = 1;
}

message EnvironmentValuesAcrossEnvsResponse {
  repeated EnvironmentValueResponse values = 1;
}

message DeleteEnvironmentValueRequest {
  string environment_id = 1;
  string key = 2;
}

message DeleteEnvironmentValueResponse {
  bool success = 1;
}
