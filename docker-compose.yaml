version: "3.1"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fasit
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - 5432:5432

  adminer:
    image: adminer
    ports:
      - 8081:8080

  pubsub:
    image: google/cloud-sdk
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8086
    ports:
      - 8086:8085
