version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "@nais/core-dependabot-reviewers"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "@nais/core-dependabot-reviewers"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "@nais/core-dependabot-reviewers"
    groups:
      gomod:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io*"
      k8s:
        patterns:
          - "k8s.io*"
