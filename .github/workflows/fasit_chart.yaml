name: Build and push fasit chart
on:
  push:
    branches:
      - main
    paths:
      - "charts/fasit/**"
      - ".github/workflows/fasit_chart.yaml"

jobs:
  build:
    permissions:
      contents: "read"
      id-token: "write"

    name: Build and push fasit chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@5a50e581162a13f4baa8916d01180d2acbc04363" # ratchet:google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@98ddc00a17442e89a24bbf282954a3b65ce6d200" # ratchet:google-github-actions/setup-gcloud@v1
      - name: "Log in to Google Artifact Registry"
        run: |-
          echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin https://europe-north1-docker.pkg.dev
      - uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # ratchet:azure/setup-helm@v3
        name: "Setup Helm"
        with:
          version: "3.9.3"

      - name: Build Chart
        run: |-
          helm package charts/fasit

      - name: Push Chart
        run: |-
          helm push fasit*.tgz oci://europe-north1-docker.pkg.dev/nais-io/nais
