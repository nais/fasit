name: Push features to GCS
on:
  push:
    paths:
      - "features/*.yaml"
      - ".github/workflows/push_features.yaml"

env:
  BUCKET: "fasit-features"

jobs:
  feature_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab

  build_and_push_fasit:
    if: github.ref == 'refs/heads/main'
    needs: [feature_tests]
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1.1.1"
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"
      - name: Sync features to GCS
        run: |-
          gsutil -m rsync -d -r features gs://${{ env.BUCKET }}
