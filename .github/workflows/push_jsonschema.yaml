name: Push features to GCS
on:
  push:
    branches:
      - main
    paths:
      - "schema/jsonschema/feature.json"
      - ".github/workflows/push_jsonschema.yaml"

env:
  BUCKET: "fasit-jsonschema"

jobs:
  upload_jsonschema:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935" # ratchet:google-github-actions/auth@v2.1.2
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a" # ratchet:google-github-actions/setup-gcloud@v1
      - name: Sync jsonschema to GCS
        run: |-
          gsutil cp schema/jsonschema/feature.json gs://${{ env.BUCKET }}
