name: Push JSON schema to GCS
on:
  push:
    branches:
      - main
    paths:
      - "schema/jsonschema/feature.json"
      - ".github/workflows/push_jsonschema.yaml"

env:
  BUCKET: "fasit-jsonschema"

jobs:
  upload_jsonschema:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2
      - name: Push JSON schema to GCS
        run: |-
          gsutil cp schema/jsonschema/feature.json gs://${{ env.BUCKET }}
