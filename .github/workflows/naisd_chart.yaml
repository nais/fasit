name: Build and push naisd chart
on:
  push:
    branches:
      - main
    paths:
      - "charts/naisd/**"
      - ".github/workflows/naisd_chart.yaml"

jobs:
  build:
    permissions:
      contents: "read"
      id-token: "write"

    name: Build and push naisd chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1.0.0"
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: "Log in to Google Artifact Registry"
        run: |-
          echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin https://europe-north1-docker.pkg.dev

      - uses: azure/setup-helm@v3
        name: "Setup Helm"
        with:
          version: "3.9.3"

      - name: Build Chart
        run: |-
          helm package charts/naisd

      - name: Push Chart
        run: |-
          helm push naisd*.tgz oci://europe-north1-docker.pkg.dev/nais-io/nais
