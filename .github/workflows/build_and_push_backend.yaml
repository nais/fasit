name: Build and deploy fasit backend
on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/naisd/**"
      - ".github/workflows/*_chart.yaml"
      - ".github/workflows/build_and_push_naisd.yaml"
      - ".github/workflows/dependabot-auto-merge.yaml"
      - ".github/workflows/push_*.yaml"
      - "features/**"
      - "schema/jsonschema/**"
      - "cmd/generate_schema/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

env:
  RUNNER_IMG: "gcr.io/distroless/base:nonroot"
  BASEIMG_IDENTITY: "keyless@distroless.iam.gserviceaccount.com"
  BASEIMG_ISSUER: "https://accounts.google.com"

permissions:
  contents: "read"
  id-token: "write"

jobs:
  tests:
    outputs:
      go_version: ${{ steps.go_version.outputs.GO_VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Go version
        id: go_version
        run: |
          echo "GO_VERSION=$(grep golang .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: asdf-vm/actions/setup@v3
      - id: asdf-cache
        uses: actions/cache@v4
        with:
          path: ~/.asdf/
          key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}
      - uses: asdf-vm/actions/install@v3
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          before_install: |
            rm ~/.asdf/.tool-versions
            asdf install golang latest
            asdf global golang latest
      - name: Find go cache dir
        id: go-cache
        run: |
          go version
          # Clear cache dirs to avoid error when restoring
          go clean -cache -modcache
          echo "gocache=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "gomodcache=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - run: make test
      - run: make check
      - run: make helm-lint
      - name: Check code format and run code generators
        run: |
          make fmt
          make generate
          echo "checking for diff after running formatters, if this fails, run 'make fmt'"
          git diff --exit-code --name-only

  build_and_push_fasit:
    needs:
      - tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - run: cosign verify --certificate-identity ${{ env.BASEIMG_IDENTITY }} --certificate-oidc-issuer ${{ env.BASEIMG_ISSUER }} ${{ env.RUNNER_IMG }}
      - uses: nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          dockerfile: Dockerfile_fasit
          name: fasit
          build_args: |
            GO_VERSION=${{ needs.tests.outputs.go_version }}
          google_service_account: gh-fasit
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: ${{ github.actor != 'dependabot[bot]' }}

  deploy_fasit:
    if: github.ref == 'refs/heads/main'
    name: Deploy fasit on push to main
    runs-on: fasit-deploy
    needs:
      - build_and_push_fasit
    steps:
      - name: Checkout fasit
        uses: actions/checkout@v4
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: Install prereqs
        uses: ./.github/actions/helm_install
      - name: Get credentials
        shell: bash
        run: |
          gcloud container clusters get-credentials nais-io --project nais-io --region europe-north1
      - name: deploy fasit
        shell: bash
        env:
          VERSION: ${{ needs.build_and_push_fasit.outputs.version }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          helm upgrade fasit-backend oci://europe-north1-docker.pkg.dev/nais-io/nais/fasit --install --atomic --wait --version 0.3.1 --set image.tag="${VERSION}" --set slackToken="${SLACK_API_TOKEN}" --namespace nais-system --reuse-values
