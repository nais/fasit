name: Build and deploy fasit backend
on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/naisd/**"
      - ".github/workflows/*_chart.yaml"
      - ".github/workflows/build_and_push_naisd.yaml"
      - ".github/workflows/dependabot-auto-merge.yaml"
      - ".github/workflows/push_*.yaml"
      - "features/**"
      - "schema/jsonschema/**"
      - "cmd/generate_schema/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

env:
  RUNNER_IMG: "gcr.io/distroless/base:nonroot"
  BASEIMG_IDENTITY: "keyless@distroless.iam.gserviceaccount.com"
  BASEIMG_ISSUER: "https://accounts.google.com"

permissions:
  contents: "read"
  id-token: "write"

jobs:
  tests:
    outputs:
      go_version: ${{ steps.go_version.outputs.GO_VERSION }}
    runs-on: ubuntu-latest-4-cores
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
      - uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # ratchet:jdx/mise-action@v3
      - name: Find Go version
        id: go_version
        run: echo "go_version=$(mise current go)" >> $GITHUB_OUTPUT
      - run: make test
      - run: make check
      - run: make helm-lint
      - name: Check code format and run code generators
        run: |
          make generate
          make fmt
          echo "checking for diff after running formatters, if this fails, run 'make fmt'"
          git diff --exit-code --name-only

  build_and_push_fasit:
    needs:
      - tests
    runs-on: ubuntu-latest-4-cores
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # ratchet:sigstore/cosign-installer@v3
      - run: cosign verify --certificate-identity ${{ env.BASEIMG_IDENTITY }} --certificate-oidc-issuer ${{ env.BASEIMG_ISSUER }} ${{ env.RUNNER_IMG }}
      - uses: nais/platform-build-push-sign@8be8359cd90915318ee8ab5fbc8337d04937ae70 # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          dockerfile: Dockerfile_fasit
          name: fasit
          build_args: |
            GO_VERSION=${{ needs.tests.outputs.go_version }}
          google_service_account: gh-fasit
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: ${{ github.actor != 'dependabot[bot]' }}

  deploy_fasit:
    if: github.ref == 'refs/heads/main'
    name: Deploy fasit on push to main
    runs-on: fasit-deploy
    needs:
      - build_and_push_fasit
    steps:
      - name: Checkout fasit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - id: "get-credentials"
        uses: "google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395" # ratchet:google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "nais-io"
          location: "europe-north1"
          project_id: "nais-io"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # ratchet:azure/setup-helm@v4.3.1
      - name: deploy fasit
        shell: bash
        env:
          VERSION: ${{ needs.build_and_push_fasit.outputs.version }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          helm upgrade fasit-backend oci://europe-north1-docker.pkg.dev/nais-io/nais/fasit --install --atomic --wait --version 0.3.1 --set image.tag="${VERSION}" --set slackToken="${SLACK_API_TOKEN}" --namespace nais-system --reuse-values
