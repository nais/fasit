name: Build and deploy fasit backend
on:
  push:
    branches: [main]
    paths-ignore:
      - "charts/naisd/**"
      - ".github/workflows/*_chart.yaml"
      - ".github/workflows/build_and_push_naisd.yaml"
      - ".github/workflows/dependabot-auto-merge.yaml"
      - ".github/workflows/push_*.yaml"
      - "features/**"
      - "schema/jsonschema/**"
      - "cmd/generate_schema/**"
  pull_request:
    types: [opened, reopened, synchronize, edited]

env:
  RUNNER_IMG: "gcr.io/distroless/static-debian11:nonroot"
  BASEIMG_IDENTITY: "keyless@distroless.iam.gserviceaccount.com"
  BASEIMG_ISSUER: "https://accounts.google.com"

jobs:
  tests:
    outputs:
      go_version: ${{ steps.go_version.outputs.GO_VERSION }}
    runs-on: ubuntu-latest-4-cores
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # ratchet:actions/checkout@v3
      - name: Find Go version
        id: go_version
        run: |
          echo "GO_VERSION=$(grep golang .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # ratchet:actions/setup-go@v4
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}
      - run: go test -cover -tags integration_test ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build_and_push_fasit:
    if: github.ref == 'refs/heads/main'
    needs: [tests]
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest-4-cores
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # ratchet:actions/checkout@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # ratchet:sigstore/cosign-installer@main
        with:
          cosign-release: "v2.2.1"
      - name: Verify runner image
        run: cosign verify --certificate-identity ${{ env.BASEIMG_IDENTITY }} --certificate-oidc-issuer ${{ env.BASEIMG_ISSUER }} ${{ env.RUNNER_IMG }}
      - uses: nais/platform-build-push-sign@main # ratchet:exclude
        id: build-push-sign
        with:
          dockerfile: Dockerfile_fasit
          name: fasit
          build_args: |
            GO_VERSION=${{ needs.tests.outputs.go_version }}
          google_service_account: gh-fasit
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: ${{ github.actor != 'dependabot[bot]' }}

  deploy_fasit:
    runs-on: ["fasit-deploy"]
    needs: ["build_and_push_fasit"]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout fasit
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@62cf5bd3e4211a0a0b51f2c6d6a37129d828611d" # ratchet:google-github-actions/auth@v2.1.2
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: Install prereqs
        uses: ./.github/actions/helm_install
      - name: Get credentials
        shell: bash
        run: |
          gcloud container clusters get-credentials nais-io --project nais-io --region europe-north1
      - name: deploy fasit
        shell: bash
        env:
          VERSION: ${{ needs.build_and_push_fasit.outputs.version }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          helm upgrade fasit-backend oci://europe-north1-docker.pkg.dev/nais-io/nais/fasit --install --atomic --wait --version 0.3.1 --set image.tag="${VERSION}" --set slackToken="${SLACK_API_TOKEN}" --namespace nais-system --reuse-values
