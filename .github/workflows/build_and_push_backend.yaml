name: Build and deploy fasit backend
on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/naisd/**"
      - ".github/workflows/*_chart.yaml"
      - ".github/workflows/build_and_push_naisd.yaml"
      - ".github/workflows/dependabot-auto-merge.yaml"
      - ".github/workflows/push_*.yaml"
      - "features/**"
      - "schema/jsonschema/**"
      - "cmd/generate_schema/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
env:
  RUNNER_IMG: "gcr.io/distroless/base:nonroot"
  BASEIMG_IDENTITY: "keyless@distroless.iam.gserviceaccount.com"
  BASEIMG_ISSUER: "https://accounts.google.com"
permissions:
  contents: "read"
  id-token: "write"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-version:
    outputs:
      go-version: ${{ steps.go-version.outputs.go-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4.0.1
      - id: go-version
        run: echo "go-version=$(mise current go)" >> $GITHUB_OUTPUT
  checks:
    strategy:
      fail-fast: false
      matrix:
        mise-task:
          - check:deadcode
          - check:gosec
          - check:govet
          - check:govulncheck
          - check:helm
          - check:ratchet
          - check:sqlc
          - check:staticcheck
          - ci:fmt
          - test:unit
          - test:integration
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4.0.1
      - run: mise run ${{ matrix.mise-task }}
  build-and-push-fasit:
    needs:
      - go-version
    runs-on: ubuntu-latest-16-cores
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # ratchet:sigstore/cosign-installer@v4.1.2
      - run: cosign verify --certificate-identity ${{ env.BASEIMG_IDENTITY }} --certificate-oidc-issuer ${{ env.BASEIMG_ISSUER }} ${{ env.RUNNER_IMG }}
      - uses: nais/platform-build-push-sign@df590279b21bc5978519685752f9eaddd546043c # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          dockerfile: Dockerfile_fasit
          name: fasit
          build_args: |
            GO_VERSION=${{ needs.go-version.outputs.go-version }}
          google_service_account: gh-fasit
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: ${{ github.actor != 'dependabot[bot]' }}
  # Used by GitHub to determine if all checks/builds have passed
  branch-protection-checkpoint:
    needs: [checks, build-and-push-fasit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.checks.result != 'success' || needs.build-and-push-fasit.result != 'success' }}
        run: exit 1
      - run: echo "All checks and builds passed."
  deploy_fasit:
    if: github.ref == 'refs/heads/main'
    name: Deploy fasit on push to main
    runs-on: fasit-deploy
    needs: [build-and-push-fasit, branch-protection-checkpoint]
    steps:
      - name: Checkout fasit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-fasit@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - id: "get-credentials"
        uses: "google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395" # ratchet:google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "nais-io"
          location: "europe-north1"
          project_id: "nais-io"
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # ratchet:azure/setup-helm@v5.0.0
      - name: deploy fasit
        shell: bash
        env:
          VERSION: ${{ needs.build-and-push-fasit.outputs.version }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          helm upgrade fasit-backend oci://europe-north1-docker.pkg.dev/nais-io/nais/fasit --install --atomic --wait --version 0.4.0 --set image.tag="${VERSION}" --set slackToken="${SLACK_API_TOKEN}" --namespace nais-system --reuse-values
