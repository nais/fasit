environmentKinds:
  - "tenant"
  - "management"

values:
  rename.myValue:
    config:
      type: string
  rename.nested.key:
    config:
      type: string

  rename.nested.computed.key:
    config:
      type: string
      secret: true
    computed:
      template: "{{ .Env.kind }}"

rename:
  - from: myValue
    to: rename.myValue
  - from: nested.key
    to: rename.nested.key
  - from: nested.computed.key
    to: rename.nested.computed.key
