tenantName:
env:
envProjectId:
# fasitAddress is the Fasit fasitd gRPC endpoint (behind a load balancer on 443 in production).
fasitAddress: fasitd.nais.io:443
# iapAudience is the OAuth client ID of the IAP-protected backend.
iapAudience: ""
# dryRun acknowledges commands without executing Helm. It must stay true while
# naisd deploys the environment, or both agents run Helm on the same releases.
# It is deliberately not exposed in Feature.yaml.
dryRun: true
# terminationGracePeriodSeconds bounds how long a pod can keep running an
# in-flight command after SIGTERM; self-upgrade timeouts are capped to fit.
terminationGracePeriodSeconds: 600
# replicaCount > 1 keeps a standby session so commands fail over while a pod
# drains (shutdown or self-upgrade).
replicaCount: 2
image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/fasitd
  pullPolicy: IfNotPresent
  tag: "main"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

no_proxy:
https_proxy:
