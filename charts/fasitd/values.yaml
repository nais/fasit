tenantName:
env:
envProjectId:
# fasitAddress is the Fasit fasitd gRPC endpoint (behind a load balancer on 443 in production).
fasitAddress: fasitd.nais.io:443
# iapAudience is the OAuth client ID of the IAP-protected backend.
iapAudience: ""
image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/fasitd
  pullPolicy: IfNotPresent
  tag: "main"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

no_proxy:
https_proxy:
