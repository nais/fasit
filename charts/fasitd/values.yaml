# Default values for fasitd.
# This is a YAML-formatted file.

tenantName:
env:
envProjectId:
# fasitAddress is the Fasit fasitd gRPC endpoint (behind Google IAP in production).
fasitAddress: ""
# iapAudience is the OAuth client ID of the IAP-protected backend.
iapAudience: ""
# insecure connects without TLS/IAP; only for local development.
insecure: "false"

image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/fasitd
  pullPolicy: IfNotPresent
  tag: "main"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

no_proxy:
https_proxy:
