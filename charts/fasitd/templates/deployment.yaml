apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fasitd.fullname" . }}
  labels:
    {{- include "fasitd.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "fasitd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fasitd.selectorLabels" . | nindent 8 }}
        tenant: {{ .Values.tenantName }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fasitd.serviceAccountName" . }}
      terminationGracePeriodSeconds: 600
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NAIS_SA_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          {{ if .Values.no_proxy }}
            - name: NO_PROXY
              value: {{ .Values.no_proxy }}
          {{ end }}
          {{ if .Values.https_proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.https_proxy }}
          {{ end }}
          args:
            - --production
            - --dry-run={{ .Values.dryRun }}
            - --tenant-name
            - {{ .Values.tenantName }}
            - --env
            - {{ .Values.env }}
            - --fasit-address
            - {{ .Values.fasitAddress }}
            - --iap-audience
            - {{ .Values.iapAudience }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: fasit-token
              mountPath: /var/run/secrets/fasit.nais.io/serviceaccount
              readOnly: true
            - mountPath: /tmp
              name: tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: fasit-token
        projected:
          sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
                audience: {{ .Values.iapAudience | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
