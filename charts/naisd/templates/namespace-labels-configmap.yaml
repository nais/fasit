apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "naisd.namespaceLabelsName" . }}
  labels:
    {{- include "naisd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  namespace.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ .Release.Namespace }}
      labels:
        {{- toYaml .Values.namespaceLabels | nindent 8 }}
