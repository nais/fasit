apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: nais-system
  name: {{ include "fasit.fullname" . }}
  labels:
    {{ include "fasit.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.ingressHost }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "fasit.fullname" . }}
                port:
                  number: 8080
            path: /query
            pathType: Prefix
