---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fasit.fullname" . }}
  labels: {{- include "fasit.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.ingressHost }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "fasit.fullname" . }}
                port:
                  name: http
            path: /query
            pathType: Prefix
          - backend:
              service:
                name: {{ include "fasit.fullname" . }}
                port:
                  name: http
            path: /
            pathType: Prefix

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fasit.fullname" . }}-deploy
  labels: {{- include "fasit.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.deployEndpoint.ingressClassName }}
  rules:
    - host: {{ .Values.deployEndpoint.ingressHost }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "fasit.fullname" . }}
                port:
                  name: http
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fasit.fullname" . }}-fasitd
  labels: {{- include "fasit.labels" . | nindent 4 }}
  annotations:
    haproxy.org/server-proto: "h2"
    haproxy.org/check: "disabled"
    haproxy.org/timeout-server: "86400s"
    haproxy.org/backend-config-snippet: |
      timeout tunnel 86400s
      http-reuse never
spec:
  ingressClassName: {{ .Values.fasitdEndpoint.ingressClassName | quote }}
  rules:
    - host: {{ .Values.fasitdEndpoint.ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fasit.fullname" . }}-grpc
                port:
                  name: grpc-fasitd
