apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fasit.fullname" . }}
  labels:
    {{- include "fasit.labels" . | nindent 4 }}
stringData:
  FASIT_DBCONN_STRING: {{ .Values.dbConnString }}
  GH_PEM: /var/run/secrets/nais.io/gh/gh.pem
  SLACK_CLUSTER_UPGRADE_CHANNEL: {{ .Values.slackClusterUpgradeChannel | quote }}
  SLACK_CHANNEL_FEATURE_ALERTS: {{ .Values.slackChannelFeatureAlerts | quote }}
  SLACK_API_TOKEN: {{ .Values.slackToken }}
