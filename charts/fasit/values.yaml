# Default values for fasit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ingressHost: "fasit.nais.io"
ingressClassName: "nais-ingress-iap"
iapAudience:
slackChannelFeatureAlerts: "nais-alerts-info"
slackToken:

image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/fasit
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "main"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 500m
    memory: 2Gi

envProjectId: "nais-io"

nodeSelector: {}

tolerations: []

affinity: {}
