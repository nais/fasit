apiVersion: v1
kind: Service
metadata:
  name: {{ include "oidcproxy.fullname" . }}
  labels:
    {{- include "oidcproxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oidcproxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
