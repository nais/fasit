{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fasit-frontend.serviceAccountName" . }}
  labels:
    {{- include "fasit-frontend.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: fasit-frontend-user@{{ .Values.envProjectId }}.iam.gserviceaccount.com
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
