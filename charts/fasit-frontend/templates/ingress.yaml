apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fasit-frontend.fullname" . }}
  labels:
    {{ include "fasit-frontend.labels" . | nindent 4}}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: fasit.nais.io
      http:
        paths:
          - backend:
              service:
                name: {{ include "fasit-frontend.fullname" . }}
                port:
                  number: 8080
            path: /
            pathType: Prefix
