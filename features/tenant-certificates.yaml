chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/tenant-certificates
source: https://github.com/nais/helm-charts/tree/main/charts/tenant-certificates
version: 0.1.0
environmentKinds:
  - "tenant"
dependsOn:
  - "cert-manager"
config:
  acme.email:
    type: string
  acme.api:
    type: string
  cloudDNS.zone:
    type: string
    required: true
  cloudDNS.project:
    type: string
    required: true
  tenant:
    type: string
    required: true
  env:
    type: string
    required: true
