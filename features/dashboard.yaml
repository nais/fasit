chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/dashboard
source: https://github.com/nais/dashboard/tree/main/charts/dashboard
version: 0.1.0
description: "Dashboard for teams showing cluster and application health"
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - "loadbalancer-iap"
      - "monitoring-management"
      - "console"
rolloutSource:
  - org: nais
    repo: dashboard
config:
  frontend.image.tag:
    type: string
    displayName: "frontend image tag"
  backend.image.tag:
    type: string
    displayName: "backend image tag"
  backend.iapAudience:
    type: string
    displayName: "IAP audience"
mapping:
  ingress.host:
    value: '{{ subdomain . "dashboard" }}'
    displayName: "Ingress host"
  backend.dbConnectionDSN:
    value: "{{ .Management.dashboard_dsn }}"
    displayName: "Database connection DSN"
  backend.projectID:
    value: "{{ .Management.project_id }}"
    displayName: "Project ID"
  backend.envs:
    value: '{{ eachOf .Envs "name" | join "," }}'
  backend.consoleToken:
    value: "{{ .Env.dashboard_console_api_key }}"
  backend.projectMapping:
    value: '{{ mapOf "name" "project_id" .Envs | mapJoin "=" | join "&"}}'
