chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/loadbalancer
source: https://github.com/nais/helm-charts/tree/main/charts/loadbalancer
version: 0.8.1
description: "External loadbalancer and ingress controller"
timeout: 15m
environmentKinds:
  - "tenant"
  - "management"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
dependsOn:
  - allOf:
      - "certificates"
      - "monitoring"
config:
  certificates:
    type: string_array
    required: true
  ingress-nginx.controller.resources.requests.cpu:
    type: string
    displayName: "Cpu request"
  ingress-nginx.controller.resources.requests.memory:
    type: string
    displayName: "Memory request"
  ingress-nginx.controller.replicaCount:
    type: int
    displayName: "Replicas"
  ingress-nginx.controller.metrics.serviceMonitor.enabled:
    type: bool
    displayName: "Enable service monitor"
mapping:
  apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server CIDR"
