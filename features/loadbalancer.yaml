chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/loadbalancer
source: https://github.com/nais/helm-charts/tree/main/charts/loadbalancer
version: 0.1.0
environmentKinds:
  - "tenant"
  - "management"
dependsOn:
  - "certificates"
config:
  certificates:
    type: string_array
    required: true
  ingress-nginx.controller.resources.requests.cpu:
    type: string
    displayNames: "Cpu request"
  ingress-nginx.controller.resources.requests.memory:
    type: string
    displayNames: "Memory request"
  ingress-nginx.controller.replicaCount:
    type: int
    displayNames: "Replicas"
