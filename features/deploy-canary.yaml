chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/deploy-canary
source: https://github.com/nais/helm-charts/tree/main/charts/deploy-canary
version: 0.1.0
environmentKinds:
  - "management"
dependsOn:
  - allOf:
    - "hookd"
mapping:
  deploy_server:
    value: "deploy.{{.Tenant.Name}}.cloud.nais.io:443"
    displayName: "Deploy server"
    description: "Deploy server host:port pair"
  clusters:
    description: "List of clusters to deploy the canary image into"
    template: |
      [{{$first := true}}{{ range $env := .Envs }}{{if $first}}{{$first = false}}{{else}},{{end}}"{{ $env.name }}"{{ end }}]
config:
  image.repository:
    type: string
  image.imagePullPolicy:
    type: string
  image.tag:
    type: string
  deploy_key:
    type: string
    secret: true
    required: true
