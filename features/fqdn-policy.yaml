chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/fqdn-policy
source: https://github.com/nais/helm-charts/tree/main/charts/fqdn-policy
version: 0.0.4
description: "Restricts outbound traffic to a set of whitelisted FQDNs"
environmentKinds:
  - "tenant"
  - "management"
  - "legacy"
dependsOn:
  - allOf:
      - cert-manager
autoInstall:
  - "tenant"
  - "management"

config:
  resources.limits.cpu:
    type: string
    displayName: "CPU limit"

  resources.limits.memory:
    type: string
    displayName: "Memory limit"

  resources.requests.cpu:
    type: string
    displayName: "CPU request"

  resources.requests.memory:
    type: string
    displayName: "Memory request"

mapping:
  replication.config.defaultAllow:
    template: '{{eq .Kind "legacy"}}'
    displayName: "Enable replication of default allow FQDN policy"
    description: "Enable replication of default allow FQDN policy to all team namespaces"

  replication.config.defaultDeny:
    template: '{{ if eq "legacy" .Kind }}false{{ else }}true{{ end }}'
    displayName: "Enable replication of default deny FQDN policy"
    description: "Enable replication of default deny FQDN policy to all team namespaces"


