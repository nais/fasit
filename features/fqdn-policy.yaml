chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/fqdn-policy
source: https://github.com/nais/helm-charts/tree/main/charts/fqdn-policy
version: 0.0.3
environmentKinds:
  - "tenant"
  - "management"
  - "legacy"
dependsOn:
  - allOf:
      - cert-manager
autoInstall:
  - "tenant"
  - "management"

config:
  resources.limits.cpu:
    type: string
    displayName: "CPU limit"

  resources.limits.memory:
    type: string
    displayName: "Memory limit"

  resources.requests.cpu:
    type: string
    displayName: "CPU request"

  resources.requests.memory:
    type: string
    displayName: "Memory request"
