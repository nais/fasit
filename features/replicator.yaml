chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/replicator
source: https://github.com/nais/helm-charts/tree/main/charts/replicator
version: 2023.1.5-61fd079
environmentKinds:
  - "tenant"
  - "legacy"
  - "onprem"
  - "management"

autoInstall:
  - "tenant"
  - "management"

dependsOn:
  - allOf:
      - "cert-manager"

mapping:
  apiserverIP:
    value: "{{ .Env.apiserver_endpoint }}"
    displayName: "API server IP"
