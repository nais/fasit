chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/replicator
source: https://github.com/nais/replicator/tree/main/charts/replicator
version: 2023.1.6-27a27fb
description: "Kubernetes operator that replicates resources, with templating functionality to namespaces matching the provided label selector"
environmentKinds:
  - "tenant"
  - "legacy"
  - "onprem"
  - "management"

#autoInstall:
#  - "tenant"
#  - "management"

dependsOn:
  - allOf:
      - "cert-manager"
config:
  debug:
    type: bool
    displayName: "Debug"
    description: "Enable debug logging"

mapping:
  apiserverIP:
    value: "{{ .Env.apiserver_endpoint }}"
    displayName: "API server IP"
