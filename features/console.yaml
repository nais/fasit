chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/console
source: https://github.com/nais/console/tree/master/charts
version: 0.0.2
environmentKinds:
  - "management"
config:
  backend.database.instance:
    type: string
    required: true
  backend.envProjectId:
    type: string
    required: true
  backend.image.tag:
    type: string
  frontend.image.tag:
    type: string
  ingress.enabled:
    type: bool
  ingress.hosts:
    type: string_array
    required: true
