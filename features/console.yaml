chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/console
source: https://github.com/nais/helm-charts/tree/main/charts/console
version: 0.0.8
environmentKinds:
  - "management"
mapping:
  backend.database.instance:
    value: "{{.Management.console_database_instance}}"
    displayName: "Database instance"
  backend.database.user:
    value: "{{.Management.console_database_user}}"
    displayName: "Database user"
  backend.database.name:
    value: "{{.Management.console_database_name}}"
    displayName: "Database name"
  backend.envProjectId:
    value: "{{.Management.project_id}}"
    displayName: "Google project ID"
  ingress.host:
    value: "console.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "Ingress URL"
config:
  backend.image.repository:
    type: string
  backend.image.imagePullPolicy:
    type: string
  backend.image.tag:
    type: string
  backend.githubEnabled:
    type: bool
  backend.githubAppId:
    type: string
  backend.githubAppInstallationId:
    type: string
  backend.githubOrganization:
    type: string
  backend.githubPrivateKeyPath:
    type: string
  backend.googleEnabled:
    type: bool
  backend.googleCredentialsFile:
    type: string
  backend.googleDelegatedUser:
    type: string
  backend.googleDomain:
    type: string
  backend.naisDeployEnabled:
    type: bool
  backend.naisDeployEndpoint:
    type: string
  backend.naisDeployProvisionKey:
    type: string
  backend.usersyncEnabled:
    type: bool
  backend.oauthClientId:
    type: string
  backend.oauthClientSecret:
    type: string
  backend.oauthRedirectUrl:
    type: string
  frontend.image.tag:
    type: string
  backend.azureClientId:
    type: string
  backend.azureClientSecret:
    type: string
  backend.azureEnabled:
    type: bool
  backend.azureRedirectUrl:
    type: string
  backend.azureTenantId:
    type: string
  backend.gcpEnabled:
    type: bool
  backend.gcpProjectParentIds:
    type: string  # fixme: this is a key:value list
  backend.naisNamespaceEnabled:
    type: bool
  backend.naisNamespaceProjectId:
    type: string
  backend.naisNamespaceTopicPrefix:
    type: string
  backend.logLevel:
    type: string
  backend.logFormat:
    type: string
