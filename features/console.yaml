chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/console
source: https://github.com/nais/helm-charts/tree/main/charts/console
version: 0.0.16
environmentKinds:
  - "management"
mapping:
  backend.database.instance:
    value: "{{.Management.console_database_instance}}"
    displayName: "Database instance"
  backend.database.user:
    value: "{{.Management.console_database_user}}"
    displayName: "Database user"
  backend.database.name:
    value: "{{.Management.console_database_name}}"
    displayName: "Database name"
  backend.envProjectId:
    value: "{{.Management.project_id}}"
    displayName: "Google project ID"
  backend.google.serviceAccountEmail:
    value: "{{.Management.console_google_service_account_email}}"
    displayName: "Google service account"
  backend.google.credentials:
    value: "{{.Management.console_google_service_account_key}}"
    displayName: Google service account credentials (JSON)
  backend.tenantDomain:
    value: "{{.Management.tenant_domain}}"
    displayName: "Tenant domain"
  ingress.host:
    value: "console.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "Ingress URL"
  backend.gcp.projectParentIds:
    value: "{{$first := true}}{{ range $cluster := .Envs }}{{if $first}}{{$first = false}}{{else}},{{end}}{{ $cluster.name }}:{{ $cluster.teams_folder_id }}{{ end }}"
    displayName: Mapping of env to teams folders
  backend.gcp.clusters:
    value: |
      {
        {{ range $i, $cluster  := .Envs -}}
          {{- if ne $i 0 -}}
            ,
          {{ end -}}
          "{{ $cluster.name }}": {
            "team_folder_id": {{ $cluster.teams_folder_id }},
            "cluster_project_id": "{{ $cluster.project_id }}"
          }
        {{- end }}
      }
    displayName: Cluster information
  backend.staticServiceAccounts:
    value: "{{.Management.console_static_service_accounts}}"
    displayName: JSON-encoded list of static service accounts
  backend.gcp.cnrmRole:
    value: "organizations/{{ .Management.org_id }}/roles/{{ .Management.cnrm_role }}"
    displayName: CNRM role string
config:
  backend.image.tag:
    type: string
  backend.github.enabled:
    type: bool
    displayName: Enable Github teams
  backend.github.appId:
    type: string
  backend.github.appInstallationId:
    type: string
  backend.github.organization:
    type: string
  backend.github.privateKey:
    type: string
    secret: true
  backend.google.enabled:
    type: bool
    displayName: Enable Google Workspaces
  backend.oauth.clientId:
    type: string
    displayName: Google OAuth 2.0 Client ID
  backend.oauth.clientSecret:
    type: string
    secret: true
    displayName: Google OAuth 2.0 Client Secret
  backend.azure.clientId:
    type: string
  backend.azure.clientSecret:
    type: string
    secret: true
  backend.azure.enabled:
    type: bool
    displayName: Enable Azure
  backend.azure.redirectUrl:
    type: string
  backend.azure.tenantId:
    type: string
  backend.gcp.enabled:
    type: bool
    displayName: Enable GCP team projects
  backend.naisNamespace.enabled:
    type: bool
    displayName: Enable Kubernetes team namespaces
  frontend.image.tag:
    type: string
    description: Frontend image tag
