chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/console
source: https://github.com/nais/console/tree/master/charts
version: 0.0.3
environmentKinds:
  - "management"
config:
  backend.database.instance:
    type: string
    required: true
  backend.envProjectId:
    type: string
    required: true
  backend.image.repository:
    type: string
  backend.image.imagePullPolicy:
    type: string
  backend.image.tag:
    type: string
  backend.githubEnabled:
    type: bool
  backend.githubAppId:
    type: string
  backend.githubAppInstallationId:
    type: string
  backend.githubOrganization:
    type: string
  backend.githubPrivateKeyPath:
    type: string
  backend.googleEnabled:
    type: bool
  backend.googleCredentialsFile:
    type: string
  backend.googleDelegatedUser:
    type: string
  backend.googleDomain:
    type: string
  backend.naisDeployEnabled:
    type: bool
  backend.naisDeployEndpoint:
    type: string
  backend.naisDeployProvisionKey:
    type: string
  backend.usersyncEnabled:
    type: bool
  backend.oauthClientId:
    type: string
  backend.oauthClientSecret:
    type: string
  backend.oauthRedirectUrl:
    type: string
  frontend.image.tag:
    type: string
  ingress.enabled:
    type: bool
  ingress.hosts:
    type: string_array
    required: true
  backend.azureClientId:
    type: string
  backend.azureClientSecret:
    type: string
  backend.azureEnabled:
    type: bool
  backend.azureRedirectUrl:
    type: string
  backend.azureTenantId:
    type: string
  backend.gcpEnabled:
    type: bool
  backend.gcpProjectParentIds:
    type: string  # fixme: this is a key:value list
  backend.naisNamespaceEnabled:
    type: bool
  backend.naisNamespaceProjectId:
    type: string
  backend.naisNamespaceTopicPrefix:
    type: string
  backend.logLevel:
    type: string
  backend.logFormat:
    type: string
