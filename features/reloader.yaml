chart: reloader
repo: https://stakater.github.io/stakater-charts/
version: v0.0.124
source: https://github.com/stakater/Reloader/tree/master/deployments/kubernetes/chart/reloader
description: "Automatically reloads pods when configmaps or secrets are changed"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
mapping:
  reloader.deployment.containerSecurityContext:
    template: |
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
  reloader.deployment.labels:
    template: |
      kyverno.policy.exclusion.nais.io/restrict-seccomp-strict: "true"
