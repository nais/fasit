chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/nav-logging
source: https://github.com/nais/helm-charts/tree/main/charts/nav-logging
version: 1.0.1
description: "Additional logging setup for NAV"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
  - "management"
dependsOn:
  - allOf:
      - "logging"

config:
  nais.envclass:
    type: string
    displayName: Environment class
  elasticsearch.indexName:
    type: string
    displayName: Elasticsearch index

mapping:
  nais.cluster:
    value: "{{.Env.name}}"
    displayName: Cluster name
  # disable networkpolicies in onprem clusters
  networkPolicy.enabled:
    template: "false"
    ignoreKind:
      - management
      - tenant
      - legacy
  # only include node logs from onprem clusters
  hostTailer.enabled:
    template: "true"
    ignoreKind:
      - management
      - tenant
      - legacy
  # only include kube-system logs from onprem clusters
  logs.elastic.kubeSystem:
    template: "true"
    ignoreKind:
      - management
      - tenant
      - legacy
