chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring-proxy
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring-proxy
version: 0.1.0
description: "Monitoring authentication proxies for all clusters"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
  - "management"

mapping:
  clusters:
    displayName: "Tenant clusters"
    # TODO: generate one psk for each cluster
    template: |
      {{range $cluster := .Envs}}
      - name: {{$cluster.name}}
        ingress: monitoring-proxy-{{$cluster.name}}.{{.Tenant.Name}}.cloud.nais.io 
        upstreamHost: nais-prometheus.{{$cluster.name}}.{{.Tenant.Name}}.cloud.nais.io
        psk: "1234567890"
      {{end}}
