chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring-proxy
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring-proxy
version: 0.1.0
description: "Monitoring authentication proxies for all clusters"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
  - "management"

mapping:
  clusters:
    displayName: "Tenant clusters"
    # TODO: generate one psk for each cluster
    template: |
      {{range $cluster := .Envs}}
      - name: {{$cluster.name}}
        ingress: monitoring-proxy-{{$cluster.name}}.external.{{$.Tenant.Name}}.cloud.nais.io 
        upstreamHost: nais-prometheus.{{$cluster.name}}.{{$.Tenant.Name}}.cloud.nais.io
        upstreamScheme: https
        psk: "{{ $cluster.monitoring_proxy_preshared_key }}"
      {{end}}
      - name: management
        ingress: monitoring-proxy-management.external.{{$.Tenant.Name}}.cloud.nais.io 
        upstreamHost: monitoring-nais-prometheus
        upstreamScheme: http
        psk: "{{.Management.monitoring_proxy_pre_shared_key}}"
