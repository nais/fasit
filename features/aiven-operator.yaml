chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/aiven-operator
source: https://github.com/nais/helm-charts/tree/main/charts/aiven-operator
version: 0.2.5
description: "Install the Aiven Operator"
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
      - kyverno
mapping:
  apiserverIP:
    value: "{{ .Env.apiserver_endpoint }}"
    displayName: "API server IP"
  aiven.project:
    value: "{{ .Env.aiven_project }}"
    displayName: Aiven project
    description: "Aiven project to create services in"
  aiven.project_vpc_id:
    value: "{{ .Env.aiven_project_vpc_id }}"
    displayName: Aiven VPC ID
  location:
    value: "{{ .Env.location }}"
    displayName: Cloud location
  tenant.environment:
    value: "{{ .Env.name }}"
  tenant.name:
    value: "{{ .Tenant.Name }}"
config:
  aiven.token:
    type: string
    secret: true
    description: An API-token with full access to the relevant projects
    displayName: Aiven API-token
