chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/velero
source: https://github.com/nais/helm-charts/tree/main/charts/velero
version: 0.6.2
description: "Velero backup service"
environmentKinds:
  - "management"
  - "tenant"
  - "onprem"
  - "legacy"
autoInstall:
  - "management"
  - "tenant"
config:
  velero.resources.requests.cpu:
    type: string
    displayName: "Cpu request"
  velero.resources.requests.memory:
    type: string
    displayName: "Memory request"
  velero.resources.limits.cpu:
    type: string
    displayName: "Cpu limit"
  velero.resources.limits.memory:
    type: string
    displayName: "Memory limit"
  velero.configuration.backupStorageLocation.bucket:
    type: string
    description: "The name of the bucket where backups will be stored"
    displayName: "Bucket name"
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.backupStorageLocation.config.serviceAccount:
    type: string
    description: "The name of the service account to use for GCS"
    displayName: "Service account"
    ignoreKind:
      - "tenant"
      - "management"
  velero.credentials.secretContents.cloud:
    type: string
    secret: true
    description: "The contents of the GCS service account key"
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.extraEnvVars.HTTPS_PROXY:
    type: string
    displayName: HTTPS proxy
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.extraEnvVars.NO_PROXY:
    type: string
    displayName: NO_PROXY
    ignoreKind:
      - "tenant"
      - "management"
  velero.serviceAccount.server.annotations.iam\.gke\.io/gcp-service-account:
    type: string
    displayName: "KSA annotation"
    ignoreKind:
      - "onprem"
mapping:
  cluster:
    value: "{{ .Env.name }}"
    displayName: "Cluster name"
  apiServerIP:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server cidr"
  velero.extraVolumeMounts:
    template: |
      - mountPath: /etc/ssl/certs/ca-certificates.crt
        name: ca-certs
    displayName: Extra volume mounts
    ignoreKind:
      - "tenant"
      - "management"
  velero.extraVolumes:
    template: |
      - hostPath:
          path: /etc/ssl/certs/ca-certificates.crt
          type: File
        name: ca-certs
    displayName: Extra volumes
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.backupStorageLocation.bucket:
    value: "{{.Env.velero_bucket}}"
    displayName: "GCP Bucket name"
    ignoreKind:
      - "onprem"
  velero.configuration.backupStorageLocation.config.serviceAccount:
    value: "{{.Env.velero_service_account}}"
    displayName: "GCP Service account"
    ignoreKind:
      - "onprem"
  velero.serviceAccount.server.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{.Env.velero_service_account}}"
    displayName: "KSA annotation"
    ignoreKind:
      - "onprem"
      - "legacy"
  velero.credentials.useSecret:
    template: "true"
    displayName: "Use secret"
    ignoreKind:
      - "management"
      - "tenant"
