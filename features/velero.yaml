chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/velero
source: https://github.com/nais/helm-charts/tree/main/charts/velero
version: 0.7.0
description: "Velero backup service"
environmentKinds:
  - "management"
  - "tenant"
  - "onprem"
  - "legacy"
autoInstall:
  - "management"
  - "tenant"

config:
  velero.resources.requests.cpu:
    type: string
    displayName: "Cpu request"
  velero.resources.requests.memory:
    type: string
    displayName: "Memory request"
  velero.resources.limits.cpu:
    type: string
    displayName: "Cpu limit"
  velero.resources.limits.memory:
    type: string
    displayName: "Memory limit"
  velero.credentials.secretContents.cloud:
    type: string
    secret: true
    description: "The contents of the GCS service account key"
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.extraEnvVars.HTTPS_PROXY:
    type: string
    displayName: HTTPS proxy
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.extraEnvVars.NO_PROXY:
    type: string
    displayName: NO_PROXY
    ignoreKind:
      - "tenant"
      - "management"
  velero.serviceAccount.server.annotations.iam\.gke\.io/gcp-service-account:
    type: string
    displayName: "KSA annotation"
    ignoreKind:
      - "onprem"
mapping:
  cluster:
    value: "{{ .Env.name }}"
    displayName: "Cluster name"
  apiServerIP:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server cidr"
  velero.extraVolumeMounts:
    template: |
      - mountPath: /etc/ssl/certs/ca-certificates.crt
        name: ca-certs
    displayName: Extra volume mounts
    ignoreKind:
      - "tenant"
      - "management"
  velero.extraVolumes:
    template: |
      - hostPath:
          path: /etc/ssl/certs/ca-certificates.crt
          type: File
        name: ca-certs
    displayName: Extra volumes
    ignoreKind:
      - "tenant"
      - "management"
  velero.configuration.backupStorageLocation:
    template: |
      {{ if or (eq .Kind "tenant") (eq .Kind "management") }}    
          - provider: gcp
            bucket: "{{.Env.velero_bucket}}"
            config:
              serviceAccount: "{{.Env.velero_service_account}}"
      {{ end }}
      {{ if eq .Kind "onprem" }}
        {{ if eq .Env.name "ci-fss" }}
            - provider: gcp
              bucket: "velero-bck_ci-fss"
              config:
                serviceAccount: "velero-ci-fss@nais-ci-e17f.iam.gserviceaccount.com"
        {{ end }}
        {{ if eq .Env.name "dev-fss" }}
            - provider: gcp
              bucket: "velero-bck_dev-fss"
              config:
                serviceAccount: "velero-dev-fss@nais-dev-2e7b.iam.gserviceaccount.com"
        {{ end }}
        {{ if eq .Env.name "prod-fss" }}
            - provider: gcp
              bucket: "velero-bck_prod-fss"
              config:
                serviceAccount: "velero-prod-fss@nais-prod-020f.iam.gserviceaccount.com"
        {{ end }}
      {{ end }}
      {{ if eq .Kind "legacy" }}
        {{ if eq .Env.name "ci-gcp" }}
            - provider: gcp
              bucket: "velero-bck_ci-gcp"
              config:
                serviceAccount: "velero@nais-ci-e17f.iam.gserviceaccount.com"
        {{ end }}
        {{ if eq .Env.name "dev-gcp" }}
            - provider: gcp
              bucket: "velero-bck_dev-gcp"
              config:
                serviceAccount: "velero@nais-dev-2e7b.iam.gserviceaccount.com"
        {{ end }}
        {{ if eq .Env.name "prod-gcp" }}
            - provider: gcp
              bucket: "velero-bck_prod-gcp"
              config:
                serviceAccount: "velero@nais-prod-020f.iam.gserviceaccount.com"
        {{ end }}
      {{ end }}
    displayName: "GCP Bucket configuration"

  velero.serviceAccount.server.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{.Env.velero_service_account}}"
    displayName: "KSA annotation"
    ignoreKind:
      - "onprem"
      - "legacy"
  velero.credentials.useSecret:
    template: "true"
    displayName: "Use secret"
    ignoreKind:
      - "management"
      - "tenant"
