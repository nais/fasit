chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/velero
source: https://github.com/nais/helm-charts/tree/main/charts/velero
version: 0.2.0
environmentKinds:
  - "management"
  - "tenant"
  - "onprem"
autoInstall:
  - "management"
  - "tenant"
mapping:
  velero.configuration.backupStorageLocation.bucket:
    value: "{{.Env.velero_bucket}}"
    displayName: "GCP Bucket name"
  velero.configuration.backupStorageLocation.config.serviceAccount:
    value: "{{.Env.velero_service_account}}"
    displayName: "GCP Service account"
  velero.serviceAccount.server.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{.Env.velero_service_account}}"
    displayName: "KSA annotation"
