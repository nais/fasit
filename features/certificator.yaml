chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/certificator
source: https://github.com/nais/helm-charts/tree/main/charts/certificator
version: 0.0.1
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
rolloutSource:
  - org: nais
    repo: certificator
config:
  image.tag:
    type: string
  caUrls:
    type: string_array
  caDirectories:
    type: string_array
  namespaceLabelSelector:
    type: string
  webproxy:
    type: bool
  podMonitor:
    type: bool
  seccomp:
    type: bool
