chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/certificator
source: https://github.com/nais/certificator/tree/master/charts/certificator
version: 0.2.0
description: Collect TLS CA certificates from various sources and expose them in PEM and JKS format as Kubernetes configmaps
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
rolloutSource:
  - org: nais
    repo: certificator
config:
  image.tag:
    type: string
  caUrls:
    type: string_array
  caDirectories:
    type: string_array
  namespaceLabelSelector:
    type: string
  webproxy:
    type: bool
  podMonitor:
    type: bool
  seccomp:
    type: bool
