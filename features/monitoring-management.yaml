chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring-management
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring-management
version: 0.13.0
environmentKinds:
  - "management"
dependsOn:
  - allOf:
    - "loadbalancer-iap"
timeout: 20m
config:
  nais_prometheus.retention:
    type: string
    displayName: Prometheus retention
  nais_prometheus.storage.size:
    type: string
    displayName: Prometheus disk size
  nais_prometheus.memory:
    type: string
    displayName: Prometheus memory
  nais_prometheus.cpu.request:
    type: string
    displayName: Prometheus cpu request
  nais_prometheus.cpu.limit:
    type: string
    displayName: Prometheus cpu limit
  alerts.slack.webhook:
    type: string
    required: true
    displayName: Slack webhook
  alerts.slack.channel:
    type: string
    displayName: Slack channel
  grafana.grafana\.ini.auth\.jwt.expect_claims:
    type: string
    displayName: Grafana JWT claims
    description: "JSON object with claims to expect in the JWT token, example:  {\"iss\": \"https://cloud.google.com/iap\",\"aud\": \"/projects/718161667033/global/backendServices/2287975999985226128\"}"
    required: true
  grafana.plugins:
    type: string_array
    displayName: Grafana plugins
    description: List of Grafana plugins to install

mapping:
  grafana.datasources:
    template: |
      datasources.yaml:
        apiVersion: 1
        datasources:
      {{ range $cluster := .Envs }}
        - name: {{ $cluster.name }}
          type: prometheus
          url: http://{{ $cluster.tenant_ilb_ip }}:9090
          access: proxy
        - name: {{ $cluster.name }}-alertmanager
          type: alertmanager
          jsonData:
            implementation: prometheus
          url: http://{{ $cluster.tenant_alertmanager_ilb_ip }}:9093
          access: proxy
        - name: {{ $cluster.name }}-loki
          type: loki
          url: http://{{ $cluster.tenant_loki_ilb_ip }}
          access: proxy
      {{ end }}
  grafana.server.domain:
    value: "{{.Tenant.Name}}.cloud.nais.io"
  grafana.server.root_url:
    value: "grafana.{{.Tenant.Name}}.cloud.nais.io"
  grafana.ingress.hosts:
    value: ["grafana.{{.Tenant.Name}}.cloud.nais.io"]
    displayName: "Grafana hosts"
  nais_prometheus.ingress.host:
    value: "nais-prometheus.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "NAIS Prometheus host"
  kube-prometheus-stack.alertmanager.ingress.hosts:
    value:
      - "alertmanager.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "Alertmanager hosts"
  tenant.name:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  tenant.clusters:
    displayName: "Tenant clusters"
    template: |
      {{range $cluster := .Envs}}
      - name: {{$cluster.name}}
        ilb: {{$cluster.nais_ilb_ip}}
      {{end}}
