chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring-management
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring-management
version: 2.5.0
description: "Tenant monitoring services in management cluster (grafana, ...)"
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - "loadbalancer-iap"
      - "monitoring"
timeout: 20m
config:
  grafana.grafana\.ini.auth\.jwt.expect_claims:
    type: string
    displayName: Grafana JWT claims
    description: 'JSON object with claims to expect in the JWT token, example:  {"iss": "https://cloud.google.com/iap","aud": "/projects/718161667033/global/backendServices/2287975999985226128"}'
    required: true
  grafana.plugins:
    type: string_array
    displayName: Grafana plugins
    description: List of Grafana plugins to install

mapping:
  grafana.datasources:
    template: |
      datasources.yaml:
        apiVersion: 1
        datasources:
      {{ with $root := . }}
      {{ range $cluster := .Envs }}
        - name: {{ $cluster.name }}
          type: prometheus
          url: https://prometheus.{{ $cluster.name }}.{{ $root.Tenant.Name }}.cloud.nais.io
          access: proxy
        - name: {{ $cluster.name }}-alertmanager
          type: alertmanager
          jsonData:
            implementation: prometheus
          url: https://alertmanager.{{ $cluster.name }}.{{ $root.Tenant.Name }}.cloud.nais.io
          access: proxy
        {{- if eq $cluster.kind "tenant" }}
        - name: {{ $cluster.name }}-loki
          type: loki
          url: https://loki.{{ $cluster.name }}.{{ $root.Tenant.Name }}.cloud.nais.io
          access: proxy
        {{- end }}
      {{ end }}
      {{end}}
  grafana.server.domain:
    value: "{{.Tenant.Name}}.cloud.nais.io"
  grafana.server.root_url:
    value: '{{ subdomain . "grafana" }}'
  grafana.ingress.hosts:
    template: |-
      ['{{ subdomain . "grafana" }}']
    displayName: "Grafana hosts"
  tenant.name:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  tenant.clusters:
    displayName: "Tenant clusters"
    template: |
      {{range $cluster := .Envs}}
      - name: {{$cluster.name}}
      {{end}}
