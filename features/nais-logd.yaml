chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/nais-logd
source: https://github.com/nais/nais-logd
version: 3.1.0
environmentKinds:
  - "management"
  - "tenant"
  - "onprem"

config:
  cluster.envclass:
    type: string
    displayName: Environment class
  fluentd.metrics.enablePodMonitor:
    type: bool
    displayName: Enable PodMonitor
  fluentd.metrics.enablePrometheusAnnotations:
    type: bool
    displayName: Enable Prometheus annotations
  elasticsearch.index_name:
    type: string
    displayName: Elasticsearch index
  throttle.bucket_period:
    type: int
    displayName: Throttle bucket period
  throttle.bucket_limit:
    type: int
    displayName: Throttle bucket limit
  throttle.reset_rate:
    type: int
    displayName: Throttle reset rate
  throttle.drop_logs:
    type: bool
    displayName: Throttle drop logs

mapping:
  cluster.name:
    value: "{{.Env.name}}"
    displayName: Cluster name
