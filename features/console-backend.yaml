chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/console-backend
source: https://github.com/nais/console-backend/tree/main/charts
version: 20230605-104314-c4d03a7
description: "Backend for NAIS console"
environmentKinds:
  - "management"
  
config: 
  host:
    type: string
    displayName: override hostname during testing
mapping:
  teams.token:
    value: "{{.Management.console_teams_api_key}}"
    displayName: "teams pre-shared key"
    description: "The pre-shared key used by console to authenticate against teams"
  serviceaccount.email:
    value: "{{.Management.console_backend_serviceaccount_email}}"
    displayName: "console-backend service account email"
  hookd.psk:
    value: "{{.Management.hookd_frontend_pre_shared_key}}"
    displayName: "hookd pre-shared key"
    description: "The pre-shared key used to authenticate against hookd"
  tenant:
    value: "{{ .Tenant.Name }}"
    displayName: "Tenant name"
  host:
    template: '{{ subdomain . "console" }}'
config:
  kubernetes.clusters:
    type: string
    required: true
    displayName: "Comma-separated list of clusters to monitor"
  audience:
    type: string
    required: true
    displayName: "IAP audience"
  resources.memory:
    type: string
    displayName: "Memory requirements (request == limit, because Autopilot)"
  resources.cpu:
    type: string
    displayName: "CPU requirements (request == limit, because Autopilot)"
    
