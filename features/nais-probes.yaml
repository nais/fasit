chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/nais-probes
source: https://github.com/nais/helm-charts/tree/main/charts/nais-probes
version: 1.8.3
environmentKinds:
  - "management"
  - "onprem"
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
    - "monitoring"
autoInstall:
  - "management"
  - "onprem"
  - "tenant"
  - "legacy"
config:
  probes.tls.secrets:
    type: string_array
    displayName: "Kubernetes TLS secrets"
  probes.tls.https.instances:
    type: string_array
    displayName: "Https instances"
  probes.tls.etcd.instances:
    type: string_array
    displayName: "Etcd instances"
    ignoreKind:
      - management
      - tenant
      - legacy
  probes.tls.vault.enabled:
    type: bool
    displayName: "Enable Vault TLS certificate probes"
    ignoreKind:
      - management
      - tenant
      - legacy
  probes.tls.vault.instances:
    type: string_array
    displayName: "Vault instances"
    ignoreKind:
      - management
      - tenant
      - legacy
  probes.tls.kafka.enabled:
    type: bool
    displayName: "Enable Kafka TLS certificate probes"
    ignoreKind:
      - management
      - tenant
      - legacy
  probes.tls.kafka.instances:
    type: string_array
    displayName: "Kafka instances"
    ignoreKind:
      - management
      - tenant
      - legacy
mapping:
  clusterKind:
    value: "{{.Kind}}"
  probes.tls.ingress.instances:
    template: |
      - wildcard.{{ .Env.name }}.{{ .Tenant.Name }}.cloud.nais.io:443
      - wildcard.external.{{ .Env.name }}.{{ .Tenant.Name }}.cloud.nais.io:443
  probes.tls.etcd.enabled:
    template: "true"
    ignoreKind:
      - management
      - tenant
      - legacy
  prometheus-blackbox-exporter.extraVolumes:
    template: |
      - name: ca-bundle-pem
        configMap:
          name: ca-bundle-pem
          defaultMode: 420
    ignoreKind:
      - management
      - tenant
      - legacy
  prometheus-blackbox-exporter.extraVolumeMounts:
    template: |
      - name: ca-bundle-pem
        mountPath: /etc/ssl/certs
        readOnly: true
    ignoreKind:
      - management
      - tenant
      - legacy
