chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/cert-manager
source: https://github.com/nais/helm-charts/tree/charts/cert-manager
version: v1.10.2
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
timeout: 30m
mapping:
  serviceAccount.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{ .Env.acme_service_account }}"
    displayName: "GCP service account"
    ignoreKind:
      - "onprem"
