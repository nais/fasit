chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/cert-manager
source: https://github.com/nais/helm-charts/tree/main/charts/cert-manager
version: 1.10.2
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
timeout: 30m
mapping:
  apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server cidr"
    ignoreKind:
      - "onprem"
  cert-manager.serviceAccount.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{ .Env.acme_service_account }}"
    displayName: "GCP service account"
    ignoreKind:
      - "onprem"
