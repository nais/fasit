chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/bifrost
source: https://github.com/nais/helm-charts/tree/main/charts/bifrost
version: 1.0.0
description: "For managing unleash"
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - loadbalancer
      - certificates
      - monitoring
rolloutSource:
  - org: nais
    repo: bifrost
mapping:
  ingress.host:
    value: '{{ subdomain . "bifrost" }}'
    displayName: "Ingress URL"
  backend.google.projectId:
    value: "{{.Management.project_id}}"
    displayName: "google project id"
  backend.google.serviceAccountEmail:
    value: "{{.Management.bifrost_sa}}"
    displayName: "google service account Email"
  backend.unleash.sqlInstanceId:
    value: "{{.Management.bifrost_unleash_sql_instance_id}}"
    displayName: "Unleash sql instance id"
