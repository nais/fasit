chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/flatcar-pauser
source: https://github.com/nais/flatcar-pauser/tree/main/charts/flatcar-pauser
version: 0.3.0
environmentKinds:
  - "onprem"
dependsOn:
  - allOf:
      - "naiserator"
      - "monitoring"
      - "nais-system"
config:
  image.tag:
    type: string
    required: true
    displayName: "Image tag"
    description: "flatcar-pauser image"
  dependsOnCluster:
    type: string
    displayName: "Depends on cluster"
    description: "Cluster to evaluate against"
mapping:
  clusterName:
    value: "{{ .Env.name }}"
    displayName: "Cluster name"
