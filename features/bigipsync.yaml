chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/bigipsync
source: https://github.com/nais/bigipsync/tree/main/charts/bigipsync
version: 0.1.0
environmentKinds:
  - "onprem"
config:
  bigipsync.address:
    type: string_array
    required: true
    displayName: "BIG-IP addresses"
    description: "IP addresses of the BIG-IP devices"
  bigipsync.username:
    type: string
    required: true
    displayName: "BIG-IP username"
    description: "Username for the BIG-IP devices"
  bigipsync.password:
    type: string
    required: true
    secret: true
    displayName: "BIG-IP password"
    description: "Password for the BIG-IP devices"
  bigipsync.partition:
    type: string
    required: true
    displayName: "BIG-IP partition"
    description: "Partition to use on the BIG-IP devices"