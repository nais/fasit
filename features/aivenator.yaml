chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/aivenator
source: https://github.com/nais/aivenator/tree/main/charts/aivenator
version: 0.2.6
description: "Kubernetes operator that provisions credentials for Aiven services"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
rolloutSource:
  - org: nais
    repo: aivenator
dependsOn:
  - allOf:
      - "replicator"
mapping:
  aiven.projects:
    value: "{{.Env.aiven_project}}"
    displayName: Aiven projects
    description: "Aiven projects (space separated) with Kafka enabled for this instance of aivenator"
  aiven.mainProject:
    value: "{{.Env.aiven_project}}"
    displayName: Main Aiven project
    description: "Main Aiven project for services that only support one"
  aiven.mainCidr:
    value: "{{.Env.aiven_vpc_cidr}}"
    displayName: CIDR for main Aiven project VPC
    ignoreKind:
      - "onprem"
  caBundle:
    template: "true"
    displayName: Enable CA bundle
    description: "Enable CA bundle for Aiven API"
    ignoreKind:
      - "tenant"
  clusterName:
    value: "{{.Env.name}}"
  tenant:
    value: "{{.Tenant.Name}}"
  replicationConfig:
    template: "true"
    displayName: Enable ReplicationConfig
    description: "Replicate common resources (e.g. NetworkPolicies) to all namespaces"
    ignoreKind:
      - "onprem"
config:
  aiven.projects:
    type: string
    description: "Aiven projects (space separated) with Kafka enabled for this instance of aivenator"
  aiven.mainProject:
    type: string
    description: "Main Aiven project for services that only support one"
  aiven.cidrs:
    type: string_array
    description: List of additional CIDRs for other Aiven project VPCs
    displayName: Additional Aiven VPC CIDRs
    ignoreKind:
      - "onprem"
      - "tenant" # remove if we decide that tenants need an "infrastructure" project
  aiven.token:
    type: string
    secret: true
    description: An API-token with full access to the relevant projects
    displayName: Aiven API-token
  aiven.serviceUserLimit:
    type: int
    description: The limit on the number of Service Users in the main project (set by Aiven)
    displayName: Service User limit
  image.repository:
    type: string
  image.pullPolicy:
    type: string
  image.tag:
    type: string
  extraEnv.AIVENATOR_USE_NATIVE_GENERATOR:
    type: bool
    displayName: Use Native Generator
    description: Use the native generator to generate JVM credentials stores, instead of the executable generator
  extraEnv.HTTPS_PROXY:
    type: string
    displayName: HTTPS proxy
    ignoreKind:
      - "tenant"
  extraEnv.NO_PROXY:
    type: string
    displayName: NO_PROXY
    ignoreKind:
      - "tenant"
