chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/vault-up
source: https://github.com/nais/vault-up/tree/main/charts/
version: 0.1.0
dependsOn:
  - allOf:
      - "monitoring"
environmentKinds:
  - "onprem"
autoInstall:
  - "onprem"
config:
  alerts.enabled:
    type: bool
    displayName: "Enable vault alerts"
  alerts.webhookUrl:
    type: string
    displayName: "Alerts webhook URL"
  alerts.channel:
    type: string
    displayName: "Alerts channel"
  vault_up.image.tag:
    type: string
    displayName: "Image tag"
  vault_up.enabled:
    type: bool
    displayName: "Enable vault_up"

mapping:
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"