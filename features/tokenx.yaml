chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/tokenx
source: https://github.com/nais/helm-charts/tree/main/charts/tokenx
version: 0.3.0
environmentKinds:
  - "tenant"
dependsOn:
  - "naiserator"
config:
  jwker.tag:
    type: string
    displayName: Image tag for jwker

  # TODO: generate JWK and distribute to tokendings
  jwker.secrets.jwk:
    type: string
    displayName: Jwker private JWK
    description: jwkers private JWK for connecting to tokendings
    required: true
    secret: true

  jwker.secrets.env.AUTH_PROVIDER_WELL_KNOWN_URL:
    type: string
    displayName: Jwker token provider Well-Known URL
    description: Well-Known URL to tokenprovider in order to communicate with tokendings
    required: true

  jwker.secrets.env.JWKER_CLIENT_ID:
    type: string
    displayName: Jwker client_id
    description: The client_id of jwker in token provider
    required: true

  jwker.secrets.env.TOKENDINGS_CLIENT_ID:
    type: string
    displayName: Tokendings client_id
    description: The client_id of tokendings in token provider
    required: true

  tokendings.tag:
    type: string
    displayName: Image tag for tokendings

  tokendings.ingresses:
    displayName: Tokendings ingresses
    type: string_array

  tokendings.outbound:
    displayName: Tokendings external hosts
    type: string_array
    required: true

  tokendings.env.APPLICATION_PROFILE:
    displayName: Tokendings application profile
    description: Allowable values [PROD, NON_PROD]
    type: string
    required: true

  tokendings.env.ISSUER_URL:
    displayName: Tokendings issuer URL
    description: The value for issuer in tokens issued by tokendings, e.g. https://tokendings.something
    type: string

  tokendings.env.SUBJECT_TOKEN_ISSUERS:
    displayName: Tokendings trusted token issuers
    description: a commaseparated list of well-known urls to trusted token issuers in a token exchange
    type: string
    required: true

mapping:
  jwker.secrets.env.CLUSTER_NAME:
    displayName: Cluster name
    value: '{{ .Env.name }}'

  tokendings.env.ISSUER_URL:
    value: 'https://tokenx.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io'

  tokendings.ingresses:
    value:
      - 'https://tokenx.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io'

