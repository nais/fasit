chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/tokenx
source: https://github.com/nais/helm-charts/tree/main/charts/tokenx
version: 0.4.3
description: "Token exchange"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "naiserator"
config:
  jwker.secrets.env.JWKER_PRIVATE_JWK:
    type: string
    displayName: Private JWK used by Jwker to sign client assertions.
    required: true
    secret: true

  jwker.tag:
    type: string
    displayName: Image tag for jwker

  tokendings.enabled:
    displayName: Enable tokendings
    type: bool

  tokendings.env.APPLICATION_PROFILE:
    displayName: Tokendings application profile
    description: Allowable values [PROD, NON_PROD]
    type: string
    required: true

  tokendings.env.AUTH_CLIENT_JWKS:
    displayName: Jwker public JWKS
    description: The public JWKS (JWK key set) used to verify client assertions from Jwker.
    type: string
    required: true

  tokendings.env.SUBJECT_TOKEN_ISSUERS:
    displayName: Tokendings trusted token issuers
    description: Comma-separated list of well-known urls to trusted token issuers in a token exchange
    type: string
    required: true

  tokendings.host:
    displayName: Tokendings host
    description: Setting this overrides the mapping value (only needed for legacy/onprem environments)
    type: string
    required: true

  tokendings.outbound:
    displayName: Tokendings external hosts
    description: List of hosts that Tokendings needs outbound access policies for
    type: string_array
    required: true

  tokendings.tag:
    type: string
    displayName: Image tag for tokendings

mapping:
  jwker.secrets.env.CLUSTER_NAME:
    displayName: Cluster name
    value: "{{ .Env.name }}"

  jwker.webproxy:
    template: '{{eq .Kind "onprem"}}'

  tokendings.enabled:
    displayName: Enable tokendings
    template: '{{ne .Kind "onprem"}}'

  tokendings.host:
    value: '{{ subdomain . "tokenx" }}'

  networkPolicy.enabled:
    template: '{{ne .Kind "onprem"}}'

  networkPolicy.apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    ignoreKind:
      - onprem
