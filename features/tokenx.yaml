chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/tokenx
source: https://github.com/nais/helm-charts/tree/main/charts/tokenx
version: 0.4.1
description: "Token exchange"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "naiserator"
config:
  jwker.tag:
    type: string
    displayName: Image tag for jwker

  jwker.secrets.env.TOKENDINGS_URL:
    type: string
    displayName: URL for tokendings
    required: true
    ignoreKind:
      - management
      - tenant

  jwker.secrets.env.JWKER_PRIVATE_JWK:
    type: string
    displayName: Private JWK
    required: true
    secret: true

  tokendings.tag:
    type: string
    displayName: Image tag for tokendings

  tokendings.ingresses:
    displayName: Tokendings ingresses
    type: string_array

  tokendings.outbound:
    displayName: Tokendings external hosts
    type: string_array
    required: true

  tokendings.env.APPLICATION_PROFILE:
    displayName: Tokendings application profile
    description: Allowable values [PROD, NON_PROD]
    type: string
    required: true

  tokendings.env.ISSUER_URL:
    displayName: Tokendings issuer URL
    description: The value for issuer in tokens issued by tokendings, e.g. https://tokendings.something
    type: string

  tokendings.env.SUBJECT_TOKEN_ISSUERS:
    displayName: Tokendings trusted token issuers
    description: a commaseparated list of well-known urls to trusted token issuers in a token exchange
    type: string
    required: true

  tokendings.env.AUTH_CLIENT_JWKS:
    displayName: Jwker public JWKS
    description: The JWKS for jwker
    type: string
    required: true

  tokendings.enabled:
    displayName: Enable tokendings
    type: bool

mapping:
  jwker.secrets.env.CLUSTER_NAME:
    displayName: Cluster name
    value: "{{ .Env.name }}"

  jwker.webproxy:
    template: '{{eq .Kind "onprem"}}'

  tokendings.enabled:
    displayName: Enable tokendings
    template: '{{ne .Kind "onprem"}}'

  tokendings.env.ISSUER_URL:
    value: 'https://{{ subdomain . "tokenx" }}'

  tokendings.ingresses:
    value:
      - 'https://{{ subdomain . "tokenx" }}'
