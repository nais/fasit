chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring
version: 1.0.0
environmentKinds:
  - "tenant"
autoInstall:
  - "tenant"
timeout: 20m
config:
  tenant_prometheus.retention:
    type: string
    displayName: Tenant prometheus retention
  tenant_prometheus.storage.size:
    type: string
    displayName: Tenant prometheus disk size
  tenant_prometheus.memory:
    type: string
    displayName: Tenant prometheus memory
  tenant_prometheus.cpu.request:
    type: string
    displayName: Tenant prometheus cpu request
  tenant_prometheus.cpu.limit:
    type: string
    displayName: Tenant prometheus cpu limit
  nais_prometheus.memory:
    type: string
    displayName: Nais prometheus memory
  nais_prometheus.cpu.request:
    type: string
    displayName: Nais prometheus cpu request
  nais_prometheus.cpu.limit:
    type: string
    displayName: Nais prometheus cpu limit
mapping:
  tenant_prometheus.ingress.host:
    value: 'prometheus.{{if eq .Kind "tenant"}}{{.Env.name}}.{{end}}{{.Tenant.Name}}.cloud.nais.io'
    displayName: "Prometheus host"
  tenant_prometheus.loadBalancerIP:
    value: "{{ .Env.tenant_ilb_ip }}"
    displayName: "Tenant Prometheus lb IP"
  kube-prometheus-stack.alertmanager.service.loadBalancerIP:
    value: "{{ .Env.tenant_ilb_ip }}"
    displayName: "Tenant Alertmanager lb IP"
  kube-prometheus-stack.alertmanager.ingress.hosts:
    value:
      - 'alertmanager.{{if eq .Kind "tenant"}}{{.Env.name}}.{{end}}{{.Tenant.Name}}.cloud.nais.io'
    displayName: "Alertmanager hosts"
  nais_prometheus.loadBalancerIP:
    value: "{{ .Env.nais_ilb_ip }}"
    displayName: "NAIS Prometheus lb IP"
