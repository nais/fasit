chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring
version: 1.51.1
description: "Monitoring stack for nais"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
  - "management"
autoInstall:
  - "tenant"
  - "management"
timeout: 20m
config:
  alerts.proxy:
    type: string
    displayName: "Alerts proxy URL"
    ignoreKind:
      - management
      - tenant
      - legacy
  alerts.teamAlerts.enabled:
    type: bool
    displayName: "Enable team slack alerts"
    ignoreKind:
      - management
  alerts.teamAlerts.webhook:
    type: string
    displayName: "Team slack alerts webhook URL"
    ignoreKind:
      - management
  nais_alertmanager.slack.webhook:
    type: string
    displayName: "Nais alerts webhook URL"
  nais_alertmanager.slack.channel:
    type: string
    displayName: "Nais alerts slack channel"
  tenant_prometheus.nodeName:
    type: string
    displayName: Tenant prometheus node name
    ignoreKind:
      - tenant
      - legacy
      - management
  tenant_prometheus.retention:
    type: string
    displayName: Tenant prometheus retention
    ignoreKind:
      - management
  tenant_prometheus.storage.size:
    type: string
    displayName: Tenant prometheus disk size
    ignoreKind:
      - management
  tenant_prometheus.memory:
    type: string
    displayName: Tenant prometheus memory
    ignoreKind:
      - management
  tenant_prometheus.cpu.request:
    type: string
    displayName: Tenant prometheus cpu request
    ignoreKind:
      - management
  nais_prometheus.nodeName:
    type: string
    displayName: Nais prometheus node name
    ignoreKind:
      - tenant
      - legacy
      - management
  nais_prometheus.retention:
    type: string
    displayName: Nais prometheus retention
  nais_prometheus.storage.size:
    type: string
    displayName: Nais prometheus disk size
  nais_prometheus.memory:
    type: string
    displayName: Nais prometheus memory
  nais_prometheus.cpu.request:
    type: string
    displayName: Nais prometheus cpu request
mapping:
  tenantCluster:
    template: "false"
    ignoreKind:
      - tenant
      - onprem
      - legacy
  nais_prometheus.storage.local:
    template: "true"
    ignoreKind:
      - management
      - tenant
      - legacy
  tenant_prometheus.storage.local:
    template: "true"
    ignoreKind:
      - management
      - tenant
      - legacy
  tenant_prometheus.ingress.host:
    value: '{{ subdomain . "prometheus" }}'
    displayName: "Prometheus host"
    ignoreKind:
      - management
  tenant_prometheus.nodeSelector.nais\.io/prometheus-node:
    value: "true"
    ignoreKind:
      - tenant
      - management
    displayName: "Tenant prometheus node selector onprem/legacy"
  tenant_alertmanager.ingress.host:
    value: '{{ subdomain . "alertmanager" }}'
    displayName: "Tenant alertmanager host"
    ignoreKind:
      - management
  nais_prometheus.ingress.host:
    value: '{{ subdomain . "nais-prometheus" }}'
    displayName: "NAIS Prometheus ingress host"
  nais_prometheus.nodeSelector.nais\.io/prometheus-node:
    value: "true"
    ignoreKind:
      - tenant
      - management
    displayName: "Nais prometheus node selector onprem/legacy"
  nais_alertmanager.ingress.host:
    value: '{{ subdomain . "nais-alertmanager" }}'
    displayName: "Nais alertmanager host"
  prometheus-adapter-nais.rules.resource:
    template: "null"
    displayName: "Disable resource metrics (v1beta1.metrics.k8s.io)"
    ignoreKind:
      - onprem
  pushgateway.enabled:
    template: "false"
    ignoreKind:
      - tenant
      - legacy
      - onprem
  prometheus-pushgateway.ingress.hosts:
    template: |
      - '{{ subdomain . "prometheus-pushgateway" }}'
    displayName: "Prometheus pushgateway host"
    ignoreKind:
      - management
  prometheus-adapter-nais.service.clusterIP:
    value: "10.254.123.45"
    displayName: "Static service ip for prometheus-adapter-nais"
    ignoreKind:
      - tenant
      - legacy
      - management
  prometheus-adapter-tenant.service.clusterIP:
    value: "10.254.123.46"
    displayName: "Static service ip for prometheus-adapter-tenant"
    ignoreKind:
      - tenant
      - legacy
      - management
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  additionalScrapeConfigs.aivenKafka.enabled:
    template: "{{ if .Env.aiven_prometheus_username }}true{{ else }}false{{ end }}"
    displayName: "Aiven Kafka scraping enabled"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.basic_auth.username:
    value: "{{ .Env.aiven_prometheus_username }}"
    displayName: "Aiven Kafka prometheus username"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.basic_auth.password:
    value: "{{ .Env.aiven_prometheus_password }}"
    displayName: "Aiven Kafka prometheus password"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.http_sd_configs:
    template: |
      - url: "https://storage.googleapis.com/io-nais-aiven-prometheus-scrapeconfigs/{{ .Env.aiven_project }}.kafka.json"
    displayName: "Aiven Kafka prometheus sd url"
  additionalScrapeConfigs.aivenOpenSearch.enabled:
    template: "{{ if .Env.aiven_prometheus_username }}true{{ else }}false{{ end }}"
    displayName: "Aiven OpenSearch scraping enabled"
  additionalScrapeConfigs.aivenOpenSearch.scrapeConfig.basic_auth.username:
    value: "{{ .Env.aiven_prometheus_username }}"
    displayName: "Aiven OpenSearch prometheus username"
  additionalScrapeConfigs.aivenOpenSearch.scrapeConfig.basic_auth.password:
    value: "{{ .Env.aiven_prometheus_password }}"
    displayName: "Aiven OpenSearch prometheus password"
  additionalScrapeConfigs.aivenOpenSearch.scrapeConfig.http_sd_configs:
    template: |
      - url: "https://storage.googleapis.com/io-nais-aiven-prometheus-scrapeconfigs/{{ .Env.aiven_project }}.opensearch.json"
    displayName: "Aiven OpenSearch prometheus sd url"
  kube-prometheus-stack.nodeExporter.enabled:
    template: "true"
    ignoreKind:
      - tenant
      - legacy
      - management
