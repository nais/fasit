chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/monitoring
source: https://github.com/nais/helm-charts/tree/main/charts/monitoring
version: 1.24.4
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
timeout: 20m
config:
  nais_alertmanager.slack.webhook:
    type: string
    displayName: "Nais alerts webhook URL"
  nais_alertmanager.slack.channel:
    type: string
    displayName: "Nais alerts slack channel"
  nais_alertmanager.slack.proxy:
    type: string
    displayName: "Nais alerts proxy URL"
  nais_alertmanager.ingress.enabled:
    type: bool
    displayName: "Enable nais-alertmanager ingress"
  tenant_prometheus.storage.enabled:
    type: bool
    displayName: Tenant prometheus enable pvc storage
  tenant_prometheus.retention:
    type: string
    displayName: Tenant prometheus retention
  tenant_prometheus.storage.type:
    type: string
    displayName: Tenant storage type (default / local)
  tenant_prometheus.storage.size:
    type: string
    displayName: Tenant prometheus disk size
  tenant_prometheus.memory:
    type: string
    displayName: Tenant prometheus memory
  tenant_prometheus.cpu.request:
    type: string
    displayName: Tenant prometheus cpu request
  tenant_prometheus.cpu.limit:
    type: string
    displayName: Tenant prometheus cpu limit
  nais_prometheus.memory:
    type: string
    displayName: Nais prometheus memory
  nais_prometheus.cpu.request:
    type: string
    displayName: Nais prometheus cpu request
  nais_prometheus.cpu.limit:
    type: string
    displayName: Nais prometheus cpu limit
mapping:
  tenant_prometheus.ingress.host:
    value: '{{ subdomain . "prometheus" }}'
    displayName: "Prometheus host"
  tenant_prometheus.nodeSelector.kubernetes\.io/role:
    value: prometheus
    ignoreKind:
      - tenant
      - legacy
    displayName: "Tenant prometheus node role onprem"
  tenant_prometheus.nodeSelector.nais\.io/prometheus-node:
    value: "true"
    ignoreKind:
      - tenant
      - onprem
    displayName: "Tenant prometheus node role legacy"
  tenant_prometheus.tolerations:
    template: |
      - key: nais.io/prometheus-node
        operator: Exists
      - key: nais.io/naas-node
        operator: Exists
    ignoreKind:
      - tenant
    displayName: "Tenant prometheus pod tolerations"
  kube-prometheus-stack.alertmanager.ingress.hosts:
    value:
      - '{{ subdomain . "alertmanager" }}'
    displayName: "Alertmanager hosts"
  nais_prometheus.ingress.host:
    value: '{{ subdomain . "nais-prometheus" }}'
    displayName: "NAIS Prometheus ingress host"
  nais_alertmanager.ingress.host:
    value: '{{ subdomain . "nais-alertmanager" }}'
    displayName: "Nais alertmanager host"
  prometheus-adapter-nais.rules.resource:
    template: "null"
    displayName: "Disable resource metrics (v1beta1.metrics.k8s.io)"
    ignoreKind:
      - onprem
  prometheus-adapter-nais.service.clusterIP:
    value: "10.254.123.45"
    displayName: "Static service ip for prometheus-adapter-nais"
    ignoreKind:
      - tenant
      - legacy
  prometheus-adapter-tenant.service.clusterIP:
    value: "10.254.123.46"
    displayName: "Static service ip for prometheus-adapter-tenant"
    ignoreKind:
      - tenant
      - legacy
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  additionalScrapeConfigs.aivenKafka.enabled:
    template: "{{ if .Env.aiven_prometheus_username }}true{{ else }}false{{ end }}"
    displayName: "Aiven Kafka scraping enabled"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.basic_auth.username:
    value: "{{ .Env.aiven_prometheus_username }}"
    displayName: "Aiven Kafka prometheus username"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.basic_auth.password:
    value: "{{ .Env.aiven_prometheus_password }}"
    displayName: "Aiven Kafka prometheus password"
  additionalScrapeConfigs.aivenKafka.scrapeConfig.http_sd_configs:
    template: |
      - url: "https://storage.googleapis.com/io-nais-aiven-prometheus-scrapeconfigs/{{ .Env.aiven_project }}.kafka.json"
    displayName: "Aiven Kafka prometheus sd url"
