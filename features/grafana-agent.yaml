chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/grafana-agent
source: https://github.com/nais/helm-charts/tree/main/charts/grafana-agent
version: 0.0.1
description: "Grafana Agent for frontend telemetry collection"
environmentKinds:
  - "tenant"
dependsOn:
  - allOf:
    - "monitoring"
    - "tempo"
mapping:
  ingress.host:
    value: '{{ subdomain . "telemetry" }}'
  cors_allowed_origins:
    template: |
      - "*.nav.no"
      - "*.nais.io"
