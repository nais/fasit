chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/grafana-agent
source: https://github.com/nais/helm-charts/tree/main/charts/grafana-agent
version: 0.0.4
description: "Grafana Agent for frontend telemetry collection"
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
      - "monitoring"
      - "tempo"
config:
  ingress.host:
    type: string
    displayName: "Public ingress hostname for telemetry"
    description: "Used in frontend applications and must be reachable by Internet users"
  ingress.class:
    type: string
    displayName: "k8s ingress class name"
mapping:
  cors_allowed_origins:
    template: |
      - "*.nav.no"
      - "*.nais.io"
agent:
  configMap:
    content: |
      integrations:
        app_agent_receiver_configs:
          sourcemaps:
            download: true
