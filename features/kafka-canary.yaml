chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary
source: https://github.com/nais/kafkarator/tree/main/charts/kafka-canary
version: 0.1.0
environmentKinds:
  - "tenant"
dependsOn:
  - allOf:
      - "aivenator"
      - "kafkarator"
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  tenant:
    template: "{{.Tenant.Name}}"
  aiven_project:
    template: "{{.Env.aiven_project_0}}"
    displayName: Aiven project
    description: "Aiven project with Kafka enabled for this instance of kafka-canary"
  cluster_name:
    template: "{{.Env.name}}"
