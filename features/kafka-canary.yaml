chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary
source: https://github.com/nais/kafkarator/tree/master/charts/kafka-canary
version: 0.4.1
description: Cronjob that deploys kafka-canary, which monitors kafka connectivity in all connected clusters.
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - nais-verification   # Providing the deploy key
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  cluster_pools:
    template: '{{ mapOf "name" "aiven_project" .Envs | mapJoin "=" | join " " }}'
    displayName: "Cluster Pools"
    description: "Space separated list of cluster and pools"
  tenant:
    template: "{{ .Tenant.Name }}"
  deploy_server:
    value: "hookd-grpc:9090"
  deploy_use_tls:
    value: "false"
config:
  canary.image.repository:
    type: string
  canary.image.tag:
    type: string
  deployer.image.repository:
    type: string
  deployer.image.pullPolicy:
    type: string
  deployer.image.tag:
    type: string
