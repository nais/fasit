chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary
source: https://github.com/nais/kafkarator/tree/master/charts/kafka-canary
version: 0.6.0
description: Cronjob that deploys kafka-canary, which monitors kafka connectivity in all connected clusters.
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - nais-verification   # Providing the deploy key
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  deploy_configs:
    template: |
      [
        {{ $tenant_name := .Tenant.Name }}
        {{ range .Envs }}
        {{ if and (ne .name "ci-fss") (ne .name "ci-gcp") }}
        {
          "kind": "{{ .kind }}",
          "cluster_name": "{{ .name }}",
          "aiven_project": "{{ .aiven_project }}",
          "tenant": "{{ $tenant_name }}",
        },
        {{ end }}
        {{ end }}
      ]
    displayName: "Deploy Configs"
    description: |
      Expects a JSON-list of objects with `cluster_name`, `kind`, `tenant` and `pool`.
      `cluster_name` is the cluster to deploy the canary to
      `pool` is the Aiven Kafka pool this instance of the canary should use
      `kind` is the environmentKind of this cluster
      `tenant` is the name of the current tenant
  deploy_server:
    value: "hookd-grpc:9090"
  deploy_use_tls:
    value: "false"
config:
  canary.image.repository:
    type: string
  canary.image.tag:
    type: string
  deployer.image.repository:
    type: string
  deployer.image.pullPolicy:
    type: string
  deployer.image.tag:
    type: string
