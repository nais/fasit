chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary
source: https://github.com/nais/kafkarator/tree/main/charts/kafka-canary
version: 0.2.0
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - hookd   # For deploying the actual canary
      - console # To ensure the nais-verification namespace exists
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  cluster_pools:
    template: '{{ mapOf "name" "aiven_project_0" .Envs | mapJoin "=" | join " " }}'
    displayName: "Cluster Pools"
    description: "Space separated list of cluster and pools"
  tenant:
    template: "{{ .Tenant.Name }}"
config:
  api_key:
    displayName: "Deploy API Key"
    description: "Hookd API KEY for deploying canary"
    type: string
  canary.image.repository:
    type: string
  canary.image.tag:
    type: string
  deployer.image.repository:
    type: string
  deployer.image.pullPolicy:
    type: string
  deployer.image.tag:
    type: string
  alert_enabled:
    type: bool
