chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary
source: https://github.com/nais/kafkarator/tree/master/charts/kafka-canary
version: 0.3.1
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - hookd   # For deploying the actual canary
      - console # Proxy for the nais-verification feature in tenant clusters, because we can't have cross environment kind dependencies
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  cluster_pools:
    template: '{{ mapOf "name" "aiven_project" .Envs | mapJoin "=" | join " " }}'
    displayName: "Cluster Pools"
    description: "Space separated list of cluster and pools"
  tenant:
    template: "{{ .Tenant.Name }}"
  deploy_server:
    template: "deploy.{{.Tenant.Name}}.cloud.nais.io"
config:
  canary.image.repository:
    type: string
  canary.image.tag:
    type: string
  deployer.image.repository:
    type: string
  deployer.image.pullPolicy:
    type: string
  deployer.image.tag:
    type: string
  alert_enabled:
    type: bool
