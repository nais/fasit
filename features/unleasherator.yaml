chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/unleasherator
source: https://github.com/nais/unleasherator/tree/main/charts/unleasherator
version: 1.9.0
description: "Operator for Unleash"
environmentKinds:
  - "management"
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
      - unleasherator-crds
rolloutSource:
  - org: nais
    repo: unleasherator
mapping:
  networkPolicy.enabled:
    template: '{{ne .Kind "onprem"}}'
  networkPolicy.allowDNS:
    template: 'true'
  networkPolicy.apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    ignoreKind:
      - onprem
  networkPolicy.allowedNamespaces:
    value:
      - bifrost-unleash
  networkPolicy.extraOutboundIPs:
    template: |
      - "{{ .Env.management_lb_internal_ip }}"
config:
  controllerManager.manager.image.tag:
    type: string
