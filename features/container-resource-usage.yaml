chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/container-resource-usage
source: https://github.com/nais/container_resource_usage/tree/master/charts/container-resource-usage
version: 2023.1.12-c442f0d
description: "Reads prometheus data and reports to bigquery - should only be installed in NAV legacy and onprem"
environmentKinds:
  - "onprem"
  - "legacy"
config:
  image.tag:
    type: string
    displayName: Image tag
  master:
    type: bool
    displayName: Master
  webProxy:
    type: bool
    displayName: Enable webproxy
  netpol.enabled:
    type: bool
    displayName: Network policies enabled in cluster
  netpol.prometheusNamespace:
    type: string
    displayName: Namespace Prometheus runs in
  bqCredentials:
    type: string
    secret: true
    displayName: Google SA credentials
mapping:
  prometheusURL:
    displayName: Prometheus URL
    value: "https://prometheus.{{ .Env.name }}.nais.io"
