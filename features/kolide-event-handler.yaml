chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kolide-event-handler
source: https://github.com/nais/kolide-event-handler/tree/main/charts
version: 0.1.0
environmentKinds:
  - "management"
config:
  secrets.env.KOLIDE_SIGNING_SECRET:
    type: string
    required: true
    secret: true
    displayName: "Kolide signing secret"

  secrets.env.KOLIDE_API_TOKEN:
    type: string
    required: true
    secret: true
    displayName: "Kolide API token"

  secrets.env.GRPC_AUTH_TOKEN:
    type: string
    required: true
    secret: true
    displayName: "gRPC auth token"

  image.tag:
    type: string
    displayName: Image tag
  ingress.enabled:
    type: bool
    displayName: Enable ingress
  ingress.hosts:
    type: string_array
    displayName: DNS names
  replicaCount:
    type: int

mapping:
  ingress.hosts:
    value:
      - 'kolide-event-handler.{{if eq .Kind "tenant"}}{{.Env.name}}.{{end}}{{.Tenant.Name}}.cloud.nais.io'
    displayName: "DNS names"
