chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/loadbalancer-iap
source: https://github.com/nais/helm-charts/tree/main/charts/loadbalancer-iap
version: 0.7.8
description: "Ingress controller and loadbalancer with IAP support"
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - "certificates"
config:
  certificates:
    type: string_array
    required: true
  iapClientId:
    type: string
    required: true
  iapClientSecret:
    type: string
    required: true
    secret: true
  ingress-nginx.controller.resources.requests.cpu:
    type: string
    displayName: "Cpu request"
  ingress-nginx.controller.resources.requests.memory:
    type: string
    displayName: "Memory request"
  ingress-nginx.controller.replicaCount:
    type: int
    displayName: "Replicas"
mapping:
  apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server CIDR"
