chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/historymanager
source: https://github.com/nais/historymanager/tree/master/charts/historymanager
version: 1.0.4
autoInstall:
  - "tenant"
  - "legacy"
  - "management"
environmentKinds:
  - "onprem"
  - "tenant"
  - "legacy"
  - "management"
config:
  image.name:
    type: string
    displayName: Image name
  image.tag:
    type: string
    displayName: Image tag
  bigQuery.projectID:
    type: string
    displayName: BigQuery Project ID
    required: true
  bigQuery.serviceAccountToken:
    type: string
    displayName: ServiceAccoint JWT
    required: true
    secret: true
  onprem:
    type: bool
