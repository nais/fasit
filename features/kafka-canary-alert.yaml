chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary-alert
source: https://github.com/nais/kafkarator/tree/master/charts/kafka-canary-alert
version: 0.1.0
description: Installs alert for kafka-canary. Requires that kafka-canary is installed in management cluster.
environmentKinds:
  - "tenant"
  - "legacy"
  - "onprem"
mapping:
  pool:
    template: '{{ .Env.aiven_project }}'
    displayName: "Cluster Pool"
    description: "Kafka pool this canary alert should monitor"
