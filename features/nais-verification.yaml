chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/nais-verification
source: https://github.com/nais/nais-verification/tree/main/charts/nais-verification
description: Creates nais-verification team for verification workloads (deploy-canary, kafka-canary etc.) and provides deploy key in a secret for other features to use
version: 0.3.1
environmentKinds:
  - "management"
autoInstall:
  - "management"
dependsOn:
  - allOf:
      - teams # Create team and get deploy key
      - hookd # Provision deploy key
rolloutSource:
  - org: nais
    repo: nais-verification
mapping:
  console.api_url:
    template: "http://teams-backend/query"
  console.api_token:
    value: "{{.Management.nais_verification_teams_api_key}}"
config:
  slackChannel:
    type: string
    description: "The name of the nais<->tenant coop channel (default #nais)"
  image.repository:
    type: string
  image.tag:
    type: string
  image.pullPolicy:
    type: string
