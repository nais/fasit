chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kyverno
version: 1.0.6
source: https://github.com/nais/helm-charts/tree/main/charts/kyverno
description: "Policy engine for Kubernetes"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "monitoring"
timeout: 20m
config:
  kyverno.admissionController.replicas:
    type: int
    displayName: "Replicas"
    description: "Number of replicas, min 3 for HA."
  kyverno.admissionController.container.resources.limits.memory:
    type: string
    displayName: "Memory limit"
    description: "Memory limit for kyverno pod."
  kyverno.admissionController.container.resources.requests.memory:
    type: string
    displayName: "Memory request"
    description: "Memory request for kyverno pod."
  kyverno.admissionController.container.resources.requests.cpu:
    type: string
    displayName: "CPU request"
    description: "CPU request for kyverno pod."
  kyverno.reportsController.resources.limits.memory:
    type: string
    displayName: "Reporter Memory limit"
    description: "Memory limit for kyverno reports pod."
  kyverno.cleanUpController.resources.limits.memory:
    type: string
    displayName: "Cleaner Memory limit"
    description: "Memory limit for kyverno cleaner pod."

mapping:
  kyverno.config.webhooks:
    # exclude namespaces
    template: |
      - namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-node-lease
              - kube-public
              - kyverno
              {{ if eq .Kind "onprem" }}- kube-flannel{{ end }}
              {{ if ne .Kind "onprem" }}- cnrm-system{{ end }}
              {{ if ne .Kind "onprem" }}- configconnector-operator-system{{ end }}
    displayName: "Webhook namespaces"
