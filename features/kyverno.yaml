chart: kyverno
repo: https://kyverno.github.io/kyverno/
version: v2.5.2
source: https://github.com/kyverno/kyverno/tree/main/charts/kyverno
environmentKinds:
  - tenant
timeout: 20m
config:
  replicaCount:
    type: int
    displayName: "Replicas"
    description: "Number of replicas, min 3 for HA."
mapping:
  replicaCount:
    template: "3"
    displayName: "Replicas"
  config.webhooks:
    # exclude namespaces
    template: |
      - namespaceselector:
          matchexpressions:
          - key: kubernetes.io/metadata.name
            operator: notin
            values:
              - kube-system
              - kube-node-lease
              - kyverno
              - cnrm-system
              - configconnector-operator-system
