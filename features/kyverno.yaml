chart: kyverno
repo: https://kyverno.github.io/kyverno/
version: v2.7.0
source: https://github.com/kyverno/kyverno/tree/main/charts/kyverno
description: "Policy engine for Kubernetes"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "monitoring"
timeout: 20m
config:
  replicaCount:
    type: int
    displayName: "Replicas"
    description: "Number of replicas, min 3 for HA."
  resources.limits.memory:
    type: string
    displayName: "Memory limit"
    description: "Memory limit for kyverno pod."
  resources.requests.memory:
    type: string
    displayName: "Memory request"
    description: "Memory request for kyverno pod."
  resources.requests.cpu:
    type: string
    displayName: "CPU request"
    description: "CPU request for kyverno pod."
mapping:
  admissionController.networkPolicy.enabled:
    template: '{{ if eq .Kind "onprem" }}false{{ else }}true{{ end }}'
    description: "Enable network policy for admission webhook"
  admissionController.networkPolicy.ingressFrom:
    template: |
        - ipBlock:
            cidr: "{{ .Env.apiserver_endpoint }}/32"
        - namespaceSelector: "{}"
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    description: "Allow access from the Kubernetes API server"
  webhooksCleanup.enabled:
    displayName: "Enable webhook cleanup"
    value: "true"
  podAnnotations.nais\.io/logformat:
    value: glog
    displayName: "Log format"
    ignoreKind:
      - management
      - tenant
  serviceMonitor.enabled:
    template: "true"
  serviceMonitor.additionalLabels:
    template: |
      nais.io/prometheus: nais
  replicaCount:
    template: "3"
    displayName: "Replicas"
  resources.limits.memory:
    value: "3548Mi"
    displayName: "Memory limit"
  resources.requests.memory:
    value: "800Mi"
    displayName: "Memory request"
  resources.requests.cpu:
    value: "600m"
    displayName: "CPU request"
  excludeKyvernoNamespace:
    template: "false"
  extraArgs:
    value:
      - --backgroundScanInterval=3h
      - --clientRateLimitQPS=150
      - --clientRateLimitBurst=300
  config.webhooks:
    # exclude namespaces
    template: |
      - namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-node-lease
              - kube-public
              - kyverno
              {{ if eq .Kind "onprem" }}- kube-flannel{{ end }}
              {{ if ne .Kind "onprem" }}- cnrm-system{{ end }}
              {{ if ne .Kind "onprem" }}- configconnector-operator-system{{ end }}
  config.resourceFilters:
    displayName: Resource filters
    value:
      - "[Event,*,*]"
      - "[*/*,kube-system,*]"
      - "[*/*,kube-public,*]"
      - "[*/*,kube-node-lease,*]"
      - "[Node,*,*]"
      - "[Node/*,*,*]"
      - "[APIService,*,*]"
      - "[APIService/*,*,*]"
      - "[TokenReview,*,*]"
      - "[SubjectAccessReview,*,*]"
      - "[SelfSubjectAccessReview,*,*]"
      - "[Binding,*,*]"
      - "[Pod/binding,*,*]"
      - "[ReplicaSet,*,*]"
      - "[ReplicaSet/*,*,*]"
      - "[AdmissionReport,*,*]"
      - "[AdmissionReport/*,*,*]"
      - "[ClusterAdmissionReport,*,*]"
      - "[ClusterAdmissionReport/*,*,*]"
      - "[BackgroundScanReport,*,*]"
      - "[BackgroundScanReport/*,*,*]"
      - "[ClusterBackgroundScanReport,*,*]"
      - "[ClusterBackgroundScanReport/*,*,*]"
      # exclude resources from the chart
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.admission-controller.roleName" . {{ "}}" }}]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.admission-controller.roleName" . {{ "}}" }}:core]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.admission-controller.roleName" . {{ "}}" }}:additional]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.background-controller.roleName" . {{ "}}" }}]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.background-controller.roleName" . {{ "}}" }}:core]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.background-controller.roleName" . {{ "}}" }}:additional]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.cleanup-controller.roleName" . {{ "}}" }}]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.cleanup-controller.roleName" . {{ "}}" }}:core]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.cleanup-controller.roleName" . {{ "}}" }}:additional]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.reports-controller.roleName" . {{ "}}" }}]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.reports-controller.roleName" . {{ "}}" }}:core]'
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.reports-controller.roleName" . {{ "}}" }}:additional]'
