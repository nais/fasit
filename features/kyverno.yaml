chart: kyverno
repo: https://kyverno.github.io/kyverno/
version: v2.7.0
source: https://github.com/kyverno/kyverno/tree/main/charts/kyverno
description: "Policy engine for Kubernetes"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "monitoring"
timeout: 20m
config:
  replicaCount:
    type: int
    displayName: "Replicas"
    description: "Number of replicas, min 3 for HA."
  resources.limits.memory:
    type: string
    displayName: "Memory limit"
    description: "Memory limit for kyverno pod."
  resources.requests.memory:
    type: string
    displayName: "Memory request"
    description: "Memory request for kyverno pod."
  resources.requests.cpu:
    type: string
    displayName: "CPU request"
    description: "CPU request for kyverno pod."
mapping:
  webhooksCleanup.enabled:
    displayName: "Enable webhook cleanup"
    value: "true"
  podAnnotations.nais\.io/logformat:
    value: glog
    displayName: "Log format"
    ignoreKind:
      - management
      - tenant
  podAnnotations.prometheus\.io/scrape:
    value: "true"
    displayName: "Prometheus scrape"
    ignoreKind:
      - management
      - tenant
  podAnnotations.prometheus\.io/port:
    value: "8000"
    displayName: "Prometheus port"
    ignoreKind:
      - management
      - tenant
  replicaCount:
    template: "3"
    displayName: "Replicas"
  resources.limits.memory:
    value: "3548Mi"
    displayName: "Memory limit"
  resources.requests.memory:
    value: "800Mi"
    displayName: "Memory request"
  resources.requests.cpu:
    value: "600m"
    displayName: "CPU request"
  excludeKyvernoNamespace:
    template: "false"
  extraArgs:
    template: |
      - --backgroundScanInterval=3h
      - --clientRateLimitQPS=150
      - --clientRateLimitBurst=300
  serviceMonitor.enabled:
    template: "true"
    ignoreKind:
      - "onprem"
      - "legacy"
  config.webhooks:
    # exclude namespaces
    template: |
      - namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-node-lease
              - kube-public
              - kyverno
              {{ if eq .Kind "onprem" }}- kube-flannel{{ end }}
              {{ if ne .Kind "onprem" }}- cnrm-system{{ end }}
              {{ if ne .Kind "onprem" }}- configconnector-operator-system{{ end }}
  config.resourceFilters:
    displayName: Resource filters
    template: |
      - "[Event,*,*]"
      - "[*,kube-system,*]"
      - "[*,kube-public,*]"
      - "[*,kube-node-lease,*]"
      - "[*,cnrm-system,*]"
      - "[*,configconnector-operator-system,*]"
      - "[Node,*,*]"
      - "[APIService,*,*]"
      - "[TokenReview,*,*]"
      - "[SubjectAccessReview,*,*]"
      - "[SelfSubjectAccessReview,*,*]"
      - "[Binding,*,*]"
      - "[ReplicaSet,*,*]"
      - "[ReportChangeRequest,*,*]"
      - "[ClusterReportChangeRequest,*,*]"
      # exclude resources from the chart
      - '[ClusterRole,*,{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}:*]'
      - '[ClusterRoleBinding,*,{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}:*]'
      - '[ServiceAccount,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.serviceAccountName" . {{ "}}" }}]'
      - '[ConfigMap,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.configMapName" . {{ "}}" }}]'
      - '[ConfigMap,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.metricsConfigMapName" . {{ "}}" }}]'
      - '[Deployment,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}]'
      - '[Job,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}-hook-pre-delete]'
      - '[NetworkPolicy,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}]'
      - '[PodDisruptionBudget,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}]'
      - '[Role,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}:*]'
      - '[RoleBinding,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}:*]'
      - '[Secret,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.serviceName" . {{ "}}" }}.{{ "{{" }} template "kyverno.namespace" . {{ "}}" }}.svc.*]'
      - '[Service,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.serviceName" . {{ "}}" }}]'
      - '[Service,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.serviceName" . {{ "}}" }}-metrics]'
      - '[ServiceMonitor,{{ "{{" }} if .Values.serviceMonitor.namespace {{ "}}" }}{{ "{{" }} .Values.serviceMonitor.namespace {{ "}}" }}{{ "{{" }} else {{ "}}" }}{{ "{{" }} template "kyverno.namespace" . {{ "}}" }}{{ "{{" }} end {{ "}}" }},{{ "{{" }} template "kyverno.serviceName" . {{ "}}" }}-service-monitor]'
      - '[Pod,{{ "{{" }} include "kyverno.namespace" . {{ "}}" }},{{ "{{" }} template "kyverno.fullname" . {{ "}}" }}-test]'
