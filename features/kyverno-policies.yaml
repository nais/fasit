chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kyverno-policies
source: https://github.com/nais/helm-charts/tree/main/charts/kyverno-policies
version: 0.9.5
description: "Sane cluster defaults - should be on in all clusters"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
dependsOn:
  - allOf:
      - kyverno
config:
  customPolicies.denyImageRegistries.extraArgs:
    type: string_array
    description: "Add additional registries to the default allow list policy of registries"
    displayName: "Add additional registries to default registries"
    ignoreKind:
      - "management"

  customPolicies.denyImageRegistries.legacy.enabled:
    type: bool
    description: "Enable a default allow list policy for image registries in legacy clusters"
    displayName: "Default allow list policy for legacy clusters"
    ignoreKind:
      - "management"
      - "tenant"

  customPolicies.denyImageRegistries.tenant.enabled:
    type: bool
    description: "Enable a default allow list policy for registries in tenant clusters"
    displayName: "Default allow list policy for tenant clusters"
    ignoreKind:
      - "management"
      - "onprem"
      - "legacy"

  customPolicies.replaceOldGithubRegistry.enabled:
    type: bool
    displayName: "Replace old Github registry"
    description: "Enable replace-old-github-registry policy"
    ignoreKind:
      - "management"
      - "tenant"

  customPolicies.denyKafkaTopicCreate.enabled:
    type: bool
    displayName: "Deny Kafka topic create"
    description: "Enable deny-kafka-topic-create policy"
    ignoreKind:
      - "management"
      - "tenant"
      - "legacy"

  customPolicies.denyServiceTypes.enabled:
    type: bool
    description: "Enable deny-service-types policy"
    displayName: "Deny service types"

  customPolicies.addSpotToleration.enabled:
    type: bool
    description: "Enable add-spot-toleration policy"
    displayName: "Add spot toleration"
    ignoreKind:
      - "onprem"
      - "management"
      - "tenant"

  customPolicies.addTeamAIToleration.enabled:
    type: bool
    description: "Enable add-team-ai-toleration policy"
    displayName: "Add team AI toleration"
    ignoreKind:
      - "management"
      - "tenant"
      - "onprem"

  customPolicies.cloneWonderWallSecret.enabled:
    type: bool
    description: "Enable clone-wonderwall-secret policy"
    displayName: "Clone Wonderwall secret"
    ignoreKind:
      - "management"
      - "onprem"

  customPolicies.kafkaDenyTopicDelete.enabled:
    type: bool
    description: "Enable kafka-deny-topic-delete policy"
    displayName: "Kafka deny topic delete"
    ignoreKind:
      - "management"
      - "onprem"

  kyverno-policies.background:
    type: bool
    description: "Run Kyverno policies in background"
    displayName: "Background"

mapping:
  customPolicies.denyImageRegistries.extraArgs:
    template: |
      - "europe-north1-docker.pkg.dev/{{ .Management.project_id }}/nais-repository/*"
    description: "A default list of additional registries to allow"
    displayName: "Additional registries allowed"
    ignoreKind:
      - "management"

  customPolicies.denyImageRegistries.legacy.enabled:
    template: '{{ if or (eq "onprem" .Kind) (eq "legacy" .Kind) }}true{{ else }}false{{ end }}'
    description: "Enable a default allow list policy for image registries in legacy clusters"
    displayName: "Default allow list policy for legacy clusters"
    ignoreKind:
      - "management"
      - "tenant"

  customPolicies.denyImageRegistries.tenant.enabled:
    template: '{{ if eq "tenant" .Kind }}true{{ else }}false{{ end }}'
    description: "Enable a default allow list policy for image registries in tenant clusters"
    displayName: "Default allow list policy for tenant clusters"
    ignoreKind:
      - "management"
      - "onprem"
      - "legacy"

  customPolicies.replaceOldGithubRegistry.enabled:
    template: '{{ if or (eq "onprem" .Kind) (eq "legacy" .Kind) }}true{{ else }}false{{ end }}'
    description: "Enable replace old github registry policy"
    displayName: "Replace old Github registry"
    ignoreKind:
      - "management"
      - "tenant"

  customPolicies.denyKafkaTopicCreate.enabled:
    template: '{{eq .Kind "onprem"}}'
    description: "Enable deny kafka topic create policy"
    displayName: "Deny Kafka topic create"
    ignoreKind:
      - "management"
      - "tenant"
      - "legacy"

  customPolicies.denyServiceTypes.enabled:
    value: "true"
    description: "Enable deny service types policy"
    displayName: "Deny service types"

  customPolicies.addTeamAIToleration.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable add-team-ai-toleration policy"
    displayName: "Add team ai toleration"
    ignoreKind:
      - "management"
      - "onprem"

  customPolicies.cloneWonderWallSecret.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable clone-wonderwall-secret policy"
    displayName: "Clone wonderwall secret"
    ignoreKind:
      - "management"
      - "onprem"

  customPolicies.kafkaDenyTopicDelete.enabled:
    template: '{{ if or (eq "tenant" .Kind) (eq "legacy" .Kind) }}true{{ else }}false{{ end }}'
    description: "Enable kafka-deny-topic-delete policy"
    displayName: "Kafka deny topic delete"
    ignoreKind:
      - "management"
      - "onprem"

  kyverno-policies.background:
    value: "false"
    description: "Run Kyverno policies in background"
    displayName: "Background"

  kyverno-policies.podSecurityStandard:
    value: '{{ if eq "legacy" .Kind }}custom{{ else }}restricted{{ end }}'
    description: "Pod security standard"
    displayName: "Pod security standard"

  kyverno-policies.podSecurityPolicies:
    displayName: "Custom pod security policies"
    template: |
      {{- if eq .Kind "legacy" }}
      - disallow-host-namespaces
      - disallow-host-path
      - disallow-host-ports
      - disallow-host-process
      - disallow-privileged-containers
      - disallow-proc-mount
      - disallow-selinux
      - disallow-privilege-escalation
      - restrict-apparmor-profiles
      - restrict-sysctls
      - restrict-volume-types
      {{- end }}
    ignoreKind:
      - "tenant"
      - "management"
      - "onprem"