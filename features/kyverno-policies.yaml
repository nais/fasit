chart: kyverno-policies
repo: https://kyverno.github.io/kyverno/
version: v2.5.2
source: https://github.com/kyverno/kyverno/tree/main/charts/kyverno-policies
environmentKinds:
  - tenant
autoInstall:
  - "tenant"
dependsOn:
  - kyverno
config:
  podSecurityStandard:
    type: string
    displayName: Pod Security Standard
mapping:
  validationFailureAction:
    value: "enforce"
    displayName: "Validation Failure Action"
    description: "Action to take when validation fails"
