chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kyverno-policies
source: https://github.com/nais/helm-charts/tree/main/charts/kyverno-policies
version: 0.9.1
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
dependsOn:
  - allOf:
      - kyverno
config:
  customPolicies.denyImageRegistries.enabled:
    type: bool
    displayName: "Deny image registries"
    description: "Enable deny-image-registries policy"

  customPolicies.replaceOldGithubRegistry.enabled:
    type: bool
    displayName: "Replace old Github registry"
    description: "Enable replace-old-github-registry policy"

  customPolicies.denyKafkaTopicCreate.enabled:
    type: bool
    displayName: "Deny Kafka topic create"
    description: "Enable deny-kafka-topic-create policy"

  customPolicies.denyServiceTypes.enabled:
    type: bool
    description: "Enable deny-service-types policy"
    displayName: "Deny service types"

  customPolicies.addSpotTolerations.enabled:
    type: bool
    description: "Enable add-spot-toleration policy"
    displayName: "Add spot toleration"

  customPolicies.generateDefaultAllowEgress.enabled:
    type: bool
    description: "Enable generate-default-allow-egress policy"
    displayName: "Generate default allow egress"

  customPolicies.addTeamAIToleration.enabled:
    type: bool
    description: "Enable add-team-ai-toleration policy"
    displayName: "Add team AI toleration"

  customPolicies.cloneWonderWallSecret.enabled:
    type: bool
    description: "Enable clone-wonderwall-secret policy"
    displayName: "Clone Wonderwall secret"

  customPolicies.kafkaDenyTopicDelete.enabled:
    type: bool
    description: "Enable kafka-deny-topic-delete policy"
    displayName: "Kafka deny topic delete"

  kyverno-policies.background:
    type: bool
    description: "Run Kyverno policies in background"
    displayName: "Background"

mapping:
  customPolicies.denyImageRegistries.enabled:
    template: '{{ if or (eq "onprem" .Kind) (eq "legacy" .Kind) }}true{{ else }}false{{ end }}'
    description: "Enable deny image registries policy"
    displayName: "Deny image registries"

  customPolicies.replaceOldGithubRegistry.enabled:
    template: '{{ if or (eq "onprem" .Kind) (eq "legacy" .Kind) }}true{{ else }}false{{ end }}'
    description: "Enable replace old github registry policy"
    displayName: "Replace old Github registry"

  customPolicies.denyKafkaTopicCreate.enabled:
    template: '{{eq .Kind "onprem"}}'
    description: "Enable deny kafka topic create policy"
    displayName: "Deny Kafka topic create"

  customPolicies.denyServiceTypes.enabled:
    value: "true"
    description: "Enable deny service types policy"
    displayName: "Deny service types"

  customPolicies.addSpotToleration.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable add-spot-toleration policy"
    displayName: "Add spot toleration"

  customPolicies.generateDefaultAllowEgress.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable generate-default-allow-egress policy"
    displayName: "Generate default allow egress"

  customPolicies.addTeamAIToleration.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable add-team-ai-toleration policy"
    displayName: "Add team ai toleration"

  customPolicies.cloneWonderWallSecret.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable clone-wonderwall-secret policy"
    displayName: "Clone wonderwall secret"

  customPolicies.kafkaDenyTopicDelete.enabled:
    template: '{{eq .Kind "legacy"}}'
    description: "Enable kafka-deny-topic-delete policy"
    displayName: "Kafka deny topic delete"

  kyverno-policies.background:
    value: "false"
    description: "Run Kyverno policies in background"
    displayName: "Background"

  kyverno-policies.podSecurityStandard:
    value: '{{ if eq "legacy" .Kind }}custom{{ else }}restricted{{ end }}'
    description: "Pod security standard"
    displayName: "Pod security standard"

  kyverno-policies.podSecurityPolicies:
    displayName: "Custom pod security policies"
    template: |
      {{- if eq .Kind "legacy" }}
      - disallow-host-namespaces
      - disallow-host-path
      - disallow-host-ports
      - disallow-host-process
      - disallow-privileged-containers
      - disallow-proc-mount
      - disallow-selinux
      - restrict-apparmor-profiles
      - restrict-sysctls
      - restrict-volume-types
      {{- end }}
    ignoreKind:
      - "tenant"
      - "management"
      - "onprem"