chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/hunter2
source: https://github.com/nais/hunter2/tree/master/charts/hunter2
version: 1.0.0
description: "Syncs secrets from Google Secret manager to kubernetes"
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
      - "naiserator"
mapping:
  googleProjectID:
    value: "{{ .Env.project_id }}"
  pubsubSubscriptionName:
    value: "{{ .Env.pubsub_subscription_name }}"
config:
  image.tag:
    type: string
    displayName: Image tag
  debug:
    type: bool
    displayName: Enable debug
  pubsubSubscriptionName:
    type: string
    displayName: "PubSub subscription name"
