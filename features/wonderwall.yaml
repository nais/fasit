chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/wonderwall
source: https://github.com/nais/helm-charts/tree/main/charts/wonderwall
version: 0.2.0
description: "Configuration for Wonderwall; a reverse proxy sidecar implementing OIDC auth. Depends on feature toggle in naiserator."
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
    - "replicator"
    - "naiserator"
    - "fqdn-policy"
    - "digdirator"
config:
  image.tag:
    type: string
  idporten.cookieName:
    type: string
    required: true
    description: Cookie name for SSO sessions.
  idporten.encryptionKey:
    type: string
    required: true
    description: Cookie encryption key, 256 bits encoded with standard base64.
  idporten.postLogoutRedirectURL:
    type: string
    required: true
    description: Where to redirect the user after global logout.
  idporten.ssoDefaultRedirectURL:
    type: string
    required: true
    description: Fallback URL for invalid SSO redirects.
  idporten.ssoDomain:
    type: string
    required: true
    description: Allowed domain for SSO (for cookies, CORS and redirect URL validation).
  idporten.ssoServerHost:
    type: string
    required: true
    description: Host for SSO server.
  idporten.ssoReplicasMin:
    type: int
    description: Minimum replicas for SSO server.
  idporten.ssoReplicasMax:
    type: int
    description: Maximum replicas for SSO server.
  loginstatus.cookieDomain:
    type: string
    required: true
  loginstatus.tokenURL:
    type: string
    required: true
  networkPolicy.enabled:
    type: bool
  redis.host:
    type: string
    required: true
  redis.port:
    type: int
    required: true
  redis.username:
    type: string
  redis.password:
    type: string
    required: true
    secret: true
