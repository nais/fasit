chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/wonderwall
source: https://github.com/nais/helm-charts/tree/main/charts/wonderwall
version: 0.1.1
description: "Configuration for Wonderwall; a reverse proxy sidecar implementing OIDC auth. Depends on feature toggle in naiserator."
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
    - "replicator"
    - "naiserator"
    - "fqdn-policy"
    #- "azurerator-nav" - TODO: not enabled in legacy yet
    #- "digdirator" - TODO: not enabled in legacy yet
config:
  idporten.postLogoutRedirectURL:
    type: string
  loginstatus.cookieDomain:
    type: string
    required: true
  loginstatus.tokenURL:
    type: string
    required: true
  networkPolicy.enabled:
    type: bool
  redis.host:
    type: string
    required: true
  redis.port:
    type: int
    required: true
  redis.username:
    type: string
  redis.password:
    type: string
    required: true
    secret: true
