chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/smsmanager
source: https://github.com/nais/smsmanager/tree/master/charts/smsmanager
version: 1.1.3
environmentKinds:
  - "onprem"
  - "tenant"
  - "legacy"
  - "management"
mapping:
  cluster:
    value: "{{ .Env.name }}"
  clusterKind:
    value: "{{ .Kind }}"
config:
  image.tag:
    type: string
    displayName: Image tag
  smsEndpoint:
    type: string
    displayName: SMS-service endpoint
    required: true
  smsUsername:
    type: string
    displayName: SMS-service username
    required: true
  smsPassword:
    type: string
    secret: true
    displayName: SMS-service password
    required: true
