chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/certificates
source: https://github.com/nais/helm-charts/tree/main/charts/certificates
version: 0.3.0
environmentKinds:
  - "tenant"
  - "management"
autoInstall:
  - "tenant"
  - "management"
dependsOn:
  - allOf:
      - "cert-manager"
config:
  acme.email:
    type: string
    displayName: "email"
  acme.api:
    type: string
    displayName: "api url"
  dnsNames:
    type: string_array
mapping:
  cloudDNS.zone:
    value: "{{.Management.cloud_dns_zone}}"
    displayName: "Cloud DNS zone"
  cloudDNS.project:
    value: "{{.Management.project_id}}"
    displayName: "Cloud DNS project"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant"
  dnsNames:
    value:
      - '{{ subdomain . "*" }}'
    displayName: "DNS names"
