chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/certificates
source: https://github.com/nais/helm-charts/tree/main/charts/certificates
version: 0.3.0
environmentKinds:
  - "tenant"
  - "management"
dependsOn:
  - "cert-manager"
config:
  acme.email:
    type: string
  acme.api:
    type: string
  cloudDNS.zone:
    type: string
    required: true
  cloudDNS.project:
    type: string
    required: true
  tenant:
    type: string
    required: true
  dnsNames:
    type: string_array
    required: true
