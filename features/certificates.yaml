chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/certificates
source: https://github.com/nais/helm-charts/tree/main/charts/certificates
version: 0.3.0
environmentKinds:
  - "tenant"
  - "management"
dependsOn:
  - "cert-manager"
config:
  acme.email:
    type: string
  acme.api:
    type: string
  dnsNames:
    type: string_array
mapping:
  cloudDNS.zone:
    value: "{{.Management.cloud_dns_zone}}"
    displayName: "Cloud DNS zone"
  cloudDNS.project:
    value: "{{.Management.project_id}}"
    displayName: "Cloud DNS project"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant"
  dnsNames:
    value:
      - '*.{{if eq .Kind "tenant"}}{{.Env.name}}.{{end}}{{.Tenant.Name}}.cloud.nais.io'
    displayName: "DNS names"
