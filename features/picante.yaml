chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/picante
source: https://github.com/nais/picante/tree/main/charts
version: 0.1.2
description: "Picante is an informer for verifying image attestations and upload sbom to dependencytrack backend"
environmentKinds:
  - "tenant"
dependsOn:
  - allOf:
      - dependencytrack
rolloutSource:
  - org: nais
    repo: picante
config:
  image.tag:
    type: string
    required: true
    displayName: "Image tag"
mapping:
  apiserverIP:
    value: "{{.Env.apiserver_endpoint}}"
    displayName: "API server IP"
  backend.ingress:
    value: "dependencytrack-backend.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "dependencytrack Ingress"
  config.storage.password:
    value: "{{.Env.picante_dependencytrack_password}}"
    displayName: "dependencytrack API password"
  config.identities:
    template: |
      - issuer: "https://accounts.google.com"
        subjectRegExp: ".*@nais-io.iam.gserviceaccount.com"
    displayName: "Preconfigured signature sa Identities"
  config.teamIdentity:
    template: |
      {{ if or (eq .Kind "onprem") (eq .Kind "legacy") (eq .Tenant.Name "nav") }}
        prefix: "gar"
        issuer: "https://accounts.google.com"
        domain: "nais-management-233d.iam.gserviceaccount.com"
      {{ else }}
        prefix: "gar"
        issuer: "https://accounts.google.com"
        domain: "{{.Management.project_id}}.iam.gserviceaccount.com"
      {{ end }}
    displayName: "Preconfigured team identity"