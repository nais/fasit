chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/picante
source: https://github.com/nais/picante/tree/main/charts
version: 0.0.1
description: "Picante is an informer for verifying image attestations and upload sbom to salsa storage backend"
environmentKinds:
  - "tenant"
dependsOn:
  - allOf:
      - salsa-storage
rolloutSource:
  - org: nais
    repo: picante
config:
  image.tag:
    type: string
    required: true
    displayName: "Image tag"
  config.storage.apiKey:
    type: string
    displayName: "Salsa storage API key"
    required: true
    secret: true
    description: "API key for salsa storage backend"
  onfig.kmsPubKey:
    type: string
    displayName: "KMS public key"
    required: true
    description: "KMS public key for decrypting salsa storage API key"
mapping:
  apiserverIP:
    value: "{{.Env.apiserver_endpoint}}"
    displayName: "API server IP"
  config.storage.api:
    value: "https://salsa-storage-backend.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "Salsa storage API"
  config.identities:
    template: |
      - issuer: "https://accounts.google.com"
        subjectRegExp: ".*@{{.Management.project_id}}.iam.gserviceaccount.com"
      - issuer: "https://accounts.google.com"
        subjectRegExp: ".*@nais-io.iam.gserviceaccount.com"
      - issuer: "https://accounts.google.com"
        subjectRegExp: ".*@nais-management-233d.iam.gserviceaccount.com"
    displayName: "Signature sa Identities"
  config.kmsPubKey:
    template: |-
      -----BEGIN PUBLIC KEY-----\n
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEUxgOVWCBlCTpJcKKJxQTLBAkp5F9\n
      /rKmU0cIhHkBJmbPLcDtmoDX0fX7d9OzpK7eLyBg+c/rRcQgGvZvBCLRKQ==\n
      -----END PUBLIC KEY-----
    displayName: "KMS public key"