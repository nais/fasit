chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/contests
source: https://github.com/nais/helm-charts/tree/main/charts/contests
version: 0.6.0
dependsOn:
  - allOf:
    - "naiserator"
    - "cnrm"
    - "monitoring"
environmentKinds:
  - "tenant"
  - "onprem"
autoInstall:
  - "tenant"
config:
  image.tag:
    type: string
    displayName: "Image tag"
  alerts.enabled:
    type: bool
    displayName: "Enable alerts"

  targetURLs:
    type: string_array
    displayName: "Default Target URLs"
  additionalTargetURLs:
    type: string_array
    displayName: "Additional Target URLs"

  ingresses:
    type: string_array
    displayName: "Ingresses"

mapping:
  ingresses:
    value:
      - '{{ if ne .Kind "onprem" }}https://contests.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io{{ end }}'
    displayName: "Ingresses"
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  kafka.pool:
    value: "{{.Env.aiven_project_0}}"
    displayName: "Kafka pool"