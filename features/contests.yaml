chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/contests
source: https://github.com/nais/helm-charts/tree/main/charts/contests
version: 0.5.3
dependsOn:
  - allOf:
    - "naiserator"
    - "cnrm"
    - "monitoring"
environmentKinds:
  - "tenant"
autoInstall:
  - "tenant"
config:
  image.tag:
    type: string
    displayName: "Image tag"
mapping:
  ingresses:
    value:
      - "https://contests.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "DNS names"
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  kafka.pool:
    value: "{{.Env.aiven_project_0}}"
    displayName: "Kafka pool"