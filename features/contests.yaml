chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/contests
source: https://github.com/nais/contests
version: 2023.3.22-5993fb1
description: "Checks connectivity to database, bucket and ingresses via blackbox exporter"
dependsOn:
  - allOf:
      - "monitoring"
environmentKinds:
  - "tenant"
  - "legacy"
config:
  contests.kafka.enabled:
    type: bool
    displayName: Enable Kafka checks
  contests.storage.enabled:
    type: bool
    displayName: Enable storage checks (GCP postgres + bucket)
  blackboxExporter.additionalTargetURLs:
    type: string_array
    displayName: "Additional Target URLs"

mapping:
  contests.ingresses:
    value:
      - "https://contests.{{ .Env.name }}.{{ .Tenant.Name }}.cloud.nais.io"
    displayName: "Ingresses"
  env:
    value: "{{ .Env.name }}"
    displayName: "Environment name"
  tenant:
    value: "{{ .Tenant.Name }}"
    displayName: "Tenant name"
  contests.kafka.pool:
    value: "{{ .Env.aiven_project }}"
    displayName: "Kafka pool"
