chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/contests
source: https://github.com/nais/contests/tree/main/charts/
version: 0.6.0
dependsOn:
  - allOf:
      - "naiserator"
      - "monitoring"
environmentKinds:
  - "tenant"
  - "onprem"
autoInstall:
  - "tenant"
config:
  alerts.enabled:
    type: bool
    displayName: "Enable alerts"
  contests.image.tag:
    type: string
    displayName: "Image tag"
  contests.storage.enabled:
    type: bool
    displayName: "Enable storage"
  contests.kafka.enabled:
    type: bool
    displayName: "Enable Kafka"
  blackboxExporter.targetURLs:
    type: string_array
    displayName: "Default Target URLs"
    description: "urls to probe by default, i.e. which connectivity tests to run"

  blackboxExporter.additionalTargetURLs:
    type: string_array
    displayName: "Additional Target URLs"

  contests.ingresses:
    type: string_array
    displayName: "Ingresses"
    ignoreKind:
      - "onprem"

  conntests.connect.url:
    type: string
    displayName: "Connect URL (downstream from contests app)"

mapping:
  contests.ingresses:
    value:
      - 'https://{{ subdomain . "contests" }}'
    displayName: "Ingresses"
    ignoreKind:
      - "onprem"
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  contests.kafka.pool:
    value: "{{.Env.aiven_project_0}}"
    displayName: "Kafka pool"
