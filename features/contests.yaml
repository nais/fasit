chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/contests
source: https://github.com/nais/helm-charts/tree/main/charts/contests
version: 0.5.0
dependsOn:
  - "naiserator"
  - "cnrm"
  - "monitoring"
environmentKinds:
  - "tenant"
config:
  image.tag:
    type: string
    displayName: "Image tag"
mapping:
  ingresses:
    value:
      - "https://nais-testapp-a.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "DNS names"
  env:
    value: "{{.Env.name}}"
    displayName: "Environment name"
  tenant:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
