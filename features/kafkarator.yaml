chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafkarator
source: https://github.com/nais/kafkarator/tree/main/charts/kafkarator
version: 0.2.2
description: Manage Kafka topics for Aiven Kafka
environmentKinds:
  - "tenant"
  - "legacy"
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  aiven.projects:
    value: "{{.Env.aiven_project}}"
    displayName: Aiven projects
    description: "Aiven projects (space separated) with Kafka enabled for this instance of kafkarator"
  caBundle:
    template: "true"
    displayName: Enable CA bundle
    description: "Enable CA bundle for Aiven API"
    ignoreKind:
      - "tenant"
config:
  aiven.projects:
    type: string
    description: "Aiven projects (space separated) with Kafka enabled for this instance of kafkarator"
  aiven.token:
    type: string
    secret: true
    description: An API-token with full access to the relevant projects
    displayName: Aiven API-token
  image.repository:
    type: string
  image.pullPolicy:
    type: string
  image.tag:
    type: string
  extraEnv.HTTPS_PROXY:
    type: string
    displayName: HTTPS proxy
    ignoreKind:
      - "tenant"
  extraEnv.NO_PROXY:
    type: string
    displayName: NO_PROXY
    ignoreKind:
      - "tenant"
