chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/teams
source: https://github.com/nais/helm-charts/tree/main/charts/teams
version: 0.0.34
description: "For managing teams on the platform"
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - loadbalancer
      - certificates
      - monitoring
rolloutSource:
  - org: nais
    repo: teams-backend
  - org: nais
    repo: teams-frontend
mapping:
  backend.database.instance:
    value: "{{.Management.teams_database_instance}}"
    displayName: "Database instance"
  backend.database.user:
    value: "{{.Management.teams_database_user}}"
    displayName: "Database user"
  backend.database.name:
    value: "{{.Management.teams_database_name}}"
    displayName: "Database name"
  backend.googleManagementProjectID:
    value: "{{.Management.project_id}}"
    displayName: "Google management project ID"
  backend.google.serviceAccountEmail:
    value: "{{.Management.teams_google_service_account_email}}"
    displayName: "Google service account"
  backend.tenantName:
    value: "{{.Tenant.Name}}"
    displayName: "Tenant name"
  backend.tenantDomain:
    value: "{{.Management.tenant_domain}}"
    displayName: "Tenant domain"
  ingress.host:
    value: '{{ subdomain . "teams" }}'
    displayName: "Ingress URL"
  ingress.oldHost:
    value: '{{ subdomain . "console" }}'
    displayName: "Ingress URL, remove later"
  backend.gcp.clusters:
    value: '{{ (filter "kind" "tenant" .Envs | environmentsAsMap "teams_folder_id,project_id") | toJSON }}'
    displayName: Cluster information
  backend.staticServiceAccounts:
    value: "{{.Management.teams_static_service_accounts}}"
    displayName: JSON-encoded list of static service accounts
  backend.gcp.cnrmRole:
    value: "organizations/{{ .Management.org_id }}/roles/{{ .Management.cnrm_role }}"
    displayName: CNRM role string
  backend.gcp.billingAccount:
    value: "{{ .Management.billing_account }}"
    displayName: Billing account
  backend.gcp.workloadIdentityPoolName:
    value: "{{ .Management.nais_identity_pool_name }}"
    displayName: Google workload identity pool name
  backend.naisDeploy.endpoint:
    template: "https://deploy.{{.Tenant.Name}}.cloud.nais.io/api/v1/provision"
  backend.naisDeploy.deployKeyEndpoint:
    template: "http://hookd/internal/api/v1/apikey"
  backend.naisDeploy.provisionKey:
    value: "{{.Management.hookd_provision_key}}"
  # TODO: remove if hack when legacy type is converted to tenant
  backend.dependencytrack.instances:
    template: |
      [
        {{ $tenant_name := .Tenant.Name }}
        {{ range .Envs }}
        {
          "endpoint": "https://dependencytrack-backend.{{ .name }}.{{ $tenant_name }}.cloud.nais.io",
          "username": "console",
          "password": "{{ .console_dependencytrack_password }}"
        },
        {{ end }}
      ]
    displayName: "DependencyTrack instances"
  backend.gitHub.organization:
    description: The organization slug where the github reconciler will manage teams.
    value: "{{.Management.teams_github_org}}"
  backend.gitHub.authEndpoint:
    description: The endpoint for the token service that provisions teams-backend with GitHub installation tokens for the correct tenant organization.
    value: "{{.Management.teams_github_auth_endpoint}}"

config:
  backend.image.tag:
    type: string
  backend.oauth.clientId:
    type: string
    displayName: Google OAuth 2.0 Client ID
  backend.oauth.clientSecret:
    type: string
    secret: true
    displayName: Google OAuth 2.0 Client Secret
  backend.legacyNaisNamespaceMapping:
    type: string
  backend.naisNamespace.azureEnabled:
    type: bool
    displayName: Enable use of Azure groups for Kubernetes team namespaces
  frontend.image.tag:
    type: string
    description: Frontend image tag
  backend.firstRunEnableReconcilers:
    type: string
    description: Comma separated list of reconcilers to enable on first run (empty database). Changing this after teams-backend has been deployed does nothing.
