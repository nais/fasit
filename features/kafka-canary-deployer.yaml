chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/kafka-canary-deployer
source: https://github.com/nais/kafkarator/tree/main/charts/kafka-canary-deployer
version: 0.1.0
environmentKinds:
  - "management"
dependsOn:
  - allOf:
      - "hookd"
rolloutSource:
  - org: nais
    repo: kafkarator
mapping:
  cluster_pools:
    template: '{{ mapOf "name" "aiven_project_0" .Envs | mapJoin "=" | join " " }}'
    displayName: "Cluster Pools"
    description: "Space separated list of cluster and pools"
  api_key:
    template: "" # TODO
    displayName: "Deploy API Key"
    description: "Hookd API KEY for deploying canary"
config:
  canary.image.repository:
    type: string
  canary.image.tag:
    type: string
  deployer.image.repository:
    type: string
  deployer.image.pullPolicy:
    type: string
  deployer.image.tag:
    type: string
