chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/nais-netpols
source: https://github.com/nais/helm-charts/tree/main/charts/nais-netpols
version: 0.1.6
description: "Default NAIS network policies"
environmentKinds:
  - "tenant"
  - "legacy"
  - "management"
config: 
  legacyGCP:
    type: bool
    displayName: "Enable legacy netpols"
  management:
    type: bool
    displayName: "Management cluster"
  tokenxHost:
    type: string
    displayName: "Host for TokenX"
    ignoreKind:
      - "tenant"
      - "management"
mapping:
  apiServerCIDR:
    value: "{{ .Env.apiserver_endpoint }}/32"
    displayName: "API server cidr"
