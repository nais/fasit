chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/naisd
source: https://github.com/nais/fasit/tree/main/charts/naisd
version: 0.2.0
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
config:
  image.tag:
    type: string
    displayName: "Image tag"
mapping:
  tenantName:
    displayName: "Tenant name"
    template: "{{.Tenant.Name}}"
  env:
    displayName: "Env"
    template: "{{.Env.name}}"
  envProjectId:
    displayName: "Env project id"
    template: "{{.Env.project_id}}"
  management:
    displayName: "Management Cluster?"
    template: '"{{eq .Kind "management"}}"'
  google.useServiceAccountKey:
    displayName: "Use service account key?"
    template: '{{ eq .Kind "onprem" }}'
  google.serviceAccountKey:
    displayName: "Use service account key?"
    value: "{{ .Env.naisd_key }}"
