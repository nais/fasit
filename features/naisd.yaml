chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/naisd
source: https://github.com/nais/fasit/tree/main/charts/naisd
version: 0.3.0
description: "install and upgrade features based on requests from fasit"
environmentKinds:
  - "tenant"
  - "management"
  - "onprem"
  - "legacy"
config:
  image.tag:
    type: string
    displayName: "Image tag"
mapping:
  tenantName:
    displayName: "Tenant name"
    template: "{{.Tenant.Name}}"
  env:
    displayName: "Env"
    template: "{{.Env.name}}"
  envProjectId:
    displayName: "Env project id"
    template: "{{.Env.project_id}}"
  management:
    displayName: "Management Cluster?"
    template: '"{{eq .Kind "management"}}"'
  google.useServiceAccountKey:
    displayName: "Use service account key?"
    template: '{{ eq .Kind "onprem" }}'
  google.serviceAccountKey:
    displayName: "Use service account key?"
    template: "{{ .Env.naisd_key | quote }}"
  no_proxy:
    displayName: "No proxy"
    value: "10.254.0.1"
    ignoreKind:
      - "tenant"
      - "management"
      - "legacy"
  https_proxy:
    displayName: "HTTPS proxy"
    value: "http://webproxy-nais.nav.no:8088"
    ignoreKind:
      - "tenant"
      - "management"
      - "legacy"
