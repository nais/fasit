chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/aiven-poke
source: https://github.com/nais/helm-charts/tree/main/charts/aiven-poke
version: 0.2.0
environmentKinds:
  - "tenant"
  - "onprem"
dependsOn:
  - allOf:
      - "naiserator"
      - "aivenator"
rolloutSource:
  - org: nais
    repo: aiven-poke
mapping:
  aivenProject:
    value: "{{ .Env.aiven_project_0 }}"
    displayName: aiven project
    description: "Which aiven project to look for topics in"
config:
  image.tag:
    type: string
  image.pullPolicy:
    type: string
  schedule:
    type: string
  resources.limits.cpu:
    type: string
  resources.limits.memory:
    type: string
  resources.requests.cpu:
    type: string
  resources.requests.memory:
    type: string
