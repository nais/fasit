chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/aiven-poke
source: https://github.com/nais/aiven-poke
version: 0.4.3
description: Poke teams about Aiven related issues (NAV only).
environmentKinds:
  - "legacy"
dependsOn:
  - allOf:
      - "naiserator"
      - "aivenator"
rolloutSource:
  - org: nais
    repo: aiven-poke
mapping:
  aivenProject:
    value: "{{ .Env.aiven_project }}"
    displayName: aiven project
    description: "Which aiven project to look for topics in"
config:
  slackWebhookURL:
    type: string
    secret: true
  aivenToken:
    type: string
    secret: true
  push_gateway_address:
    type: string
  image.tag:
    type: string
  image.pullPolicy:
    type: string
  schedule:
    type: string
