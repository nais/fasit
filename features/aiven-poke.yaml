chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/aiven-poke
source: https://github.com/nais/aiven-poke
version: 0.4.0
environmentKinds:
  - "tenant"
  - "onprem"
# commented out as current clusters don't have these operator deployed through fasit yet
#dependsOn:
#  - allOf:
#      - "naiserator"
#      - "aivenator"
rolloutSource:
  - org: nais
    repo: aiven-poke
mapping:
  aivenProject:
    value: "{{ .Env.aiven_project_0 }}"
    displayName: aiven project
    description: "Which aiven project to look for topics in"
config:
  slackWebhookURL:
    type: string
    secret: true
  aivenToken:
    type: string
    secret: true
  image.tag:
    type: string
  image.pullPolicy:
    type: string
  schedule:
    type: string
  resources.limits.cpu:
    type: string
  resources.limits.memory:
    type: string
  resources.requests.cpu:
    type: string
  resources.requests.memory:
    type: string
