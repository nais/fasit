chart: tempo-distributed
repo: https://grafana.github.io/helm-charts
version: 1.0.0
source: https://github.com/grafana/helm-charts/tree/main/charts/tempo-distributed
description: "Grafana Tempo in MicroService mode"
environmentKinds:
  - "tenant"
dependsOn:
  - allOf:
    - "monitoring"
mapping:
  minio.enabled:
    template: "false"
  tempo.securityContext.seccompProfile.type:
    # Satisfy Kyverno policy
    value: "RuntimeDefault"
  storage.trace.backend:
    # https://grafana.com/docs/tempo/latest/configuration/#storage
    value: "gcs"
  storage.trace.gcs.bucket_name:
    value: "{{.Env.tempo_bucket_traces}}"
  serviceAccount.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{.Env.tempo_service_account}}"
  gateway.enabled:
    template: "true"
  gateway.ingress.enabled:
    template: "true"
  gateway.ingress.hosts[0].host:
    value: '{{ subdomain . "tempo" }}'
  gateway.ingress.hosts[0].paths[0].path:
    value: "/"
