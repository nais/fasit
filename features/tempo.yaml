chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/tempo
source: https://github.com/nais/helm-charts/tree/main/charts/tempo
version: 1.0.0
description: "Grafana Tempo for OTLP trace collection"
environmentKinds:
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
    - "monitoring"
mapping:
  tempo-distributed.minio.enabled:
    template: "false"
  tempo-distributed.tempo.securityContext.seccompProfile.type:
    # Satisfy Kyverno policy
    value: "RuntimeDefault"
  tempo-distributed.traces.otlp.http.enabled:
    template: "true"
  tempo-distributed.traces.otlp.grpc.enabled:
    template: "true"
  tempo-distributed.storage.trace.backend:
    # https://grafana.com/docs/tempo/latest/configuration/#storage
    value: "gcs"
  tempo-distributed.storage.trace.gcs.bucket_name:
    value: "{{.Env.tempo_bucket_traces}}"
  tempo-distributed.serviceAccount.annotations.iam\.gke\.io/gcp-service-account:
    value: "{{.Env.tempo_service_account}}"
  tempo-distributed.gateway.enabled:
    template: "true"
  tempo-distributed.gateway.ingress.ingressClassName:
    template: "nais-ingress"
  tempo-distributed.gateway.ingress.enabled:
    template: "true"
  tempo-distributed.gateway.ingress.hosts:
    template: |
      - host: '{{ subdomain . "tempo" }}'
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
