chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/up
source: https://github.com/nais/up/tree/master/charts
version: 0.3.0
environmentKinds:
  - "tenant"
  - "management"
autoInstall:
  - "tenant"
  - "management"
  - "onprem"
dependsOn:
  - anyOf:
      - "loadbalancer"
    # - "loadbalancer-onprem"
rolloutSource:
  - org: nais
    repo: up
config:
  image.tag:
    type: string
    displayName: Image tag
  ingress.enabled:
    type: bool
    displayName: Enable ingress
  ingress.hosts:
    type: string_array
    displayName: DNS names
  replicaCount:
    type: int
mapping:
  ingress.hosts:
    value:
      - 'up.{{if eq .Kind "tenant"}}{{.Env.name}}.{{end}}{{.Tenant.Name}}.cloud.nais.io'
    displayName: "DNS names"
