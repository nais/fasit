chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/azurerator
source: https://github.com/nais/azurerator/tree/master/charts
version: 0.1.0
repo: ""
environmentKinds:
  - "tenant"
  - "onprem"
dependsOn:
  - allOf:
      - "nais-crds"
      - "aivenator"
      - "kafkarator"
config:
  trygdeetaten.enabled:
    type: bool

  image.tag:
    type: string

  secret.azure_nav_tenant.kafka.enabled:
    type: bool
    displayName: "Enable Kafka (nav.no)"
    description: "Allow synchronization of events between Azurerator instances."

  secret.azure_trygdeetaten_tenant.kafka.enabled:
    type: bool
    displayName: "Enable Kafka (trygdeetaten)"
    description: "Allow synchronization of events between Azurerator instances."

  secret.azure_nav_tenant.azure.auth.client-secret:
    type: string
    secret: true
    required: true
    displayName: "Azure client secret (nav.no)"

  secret.azure_trygdeetaten_tenant.azure.auth.client-secret:
    type: string
    secret: true
    required: true
    displayName: "Azure client secret (trygdeetaten)"

  secret.azure_nav_tenant.validations.tenant.required:
    type: bool
    displayName: "Enable CR field matching (nav.no)"
    description: "Only process resources that have a matching tenant defined in the spec."

  secret.azure_trygdeetaten_tenant.validations.tenant.required:
    type: bool
    displayName: "Enable CR field matching (trygdeetaten.no)"
    description: "Only process resources that have a matching tenant defined in the spec."

mapping:
  secret.azure_nav_tenant.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  secret.azure_trygdeetaten_tenant.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  webproxy:
    template: '{{eq .Kind "onprem"}}'
