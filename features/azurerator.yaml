chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/azurerator
source: https://github.com/nais/azurerator/tree/master/charts
version: 0.1.0
repo: ""
environmentKinds:
  - "tenant"
  - "onprem"
dependsOn:
  - allOf:
      - "nais-crds"
      - "aivenator"
      - "kafkarator"
      - "naiserator"
config:
  trygdeetaten.enabled:
    type: bool
  image.tag:
    type: string

  kafka.enabled:
    type: bool

  secret.kafka.enabled:
    type: bool
    description: "should match kafka.enabled - TODO mapping value?"

  secret.azure.auth.client-secret:
    type: string
    secret: true
    required: true
    displayName: "Azure client secret"

mapping:
  secret.azure.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  webproxy:
    template: '{{eq .Kind "onprem"}}'
