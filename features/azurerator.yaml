chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/azurerator
source: https://github.com/nais/azurerator/tree/master/charts
version: 0.1.0
repo: ""
environmentKinds:
  - "tenant"
  - "onprem"
dependsOn:
  - allOf:
      - "nais-crds"
      - "aivenator"
      - "kafkarator"
config:
  trygdeetaten.enabled:
    type: bool

  image.tag:
    type: string

  secret.azure-nav-tenant.kafka.enabled:
    type: bool
    displayName: "Enable Kafka (nav.no)"
    description: "Allow synchronization of events between Azurerator instances."

  secret.azure-trygdeetaten-tenant.kafka.enabled:
    type: bool
    displayName: "Enable Kafka (trygdeetaten)"
    description: "Allow synchronization of events between Azurerator instances."

  secret.azure-nav-tenant.azure.auth.client-secret:
    type: string
    secret: true
    required: true
    displayName: "Azure client secret (nav.no)"

  secret.azure-trygdeetaten-tenant.azure.auth.client-secret:
    type: string
    secret: true
    required: true
    displayName: "Azure client secret (trygdeetaten)"

mapping:
  secret.azure-nav-tenant.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  secret.azure-trygdeetaten-tenant.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  webproxy:
    template: '{{eq .Kind "onprem"}}'
