chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/policy-reporter
source: https://github.com/nais/helm-charts/tree/main/charts/policy-reporter
version: 0.0.3
environmentKinds:
  - "management"
  - "onprem"
  - "tenant"
  - "legacy"
dependsOn:
  - allOf:
      - "kyverno"
      - "kyverno-policies"

mapping:
  policy-reporter.ui.enabled:
    template: '{{ if eq .Kind "management" }}true{{ else }}false{{ end }}'
    description: "Enable the UI"

  policy-reporter.ui.clusterName:
    template: "{{.Tenant.Name}}"
    description: "Name of the cluster to show in the UI"
    ignoreKind:
      - "onprem"
      - "legacy"
      - "tenant"

  policy-reporter.ui.clusters:
    template: |
        {{ $tenant_name := .Tenant.Name }}
        {{ range .Envs }}
          - name: "{{ .name }}"
            api: "https://policy-reporter.{{ .name }}.{{ $tenant_name }}.cloud.nais.io"
            kyvernoApi: "https://policy-reporter-kyverno-plugin.{{ .name }}.{{ $tenant_name }}.cloud.nais.io"
            skipTLS: true
        {{ end }}
    description: "List of clusters to show in the UI"
    ignoreKind:
      - "onprem"
      - "legacy"
      - "tenant"

  networkPolicy.fqdn.enabled:
    template: '{{ if eq .Kind "management" }}true{{ else }}false{{ end }}'
    description: "Enable the FQDN network policy"

  networkPolicy.fqdn.egressTo:
    template: |
      {{ $tenant_name := .Tenant.Name }}
      {{ range .Envs }}
        - "policy-reporter-kyverno-plugin.{{ .name }}.{{ $tenant_name }}.cloud.nais.io"
        - "policy-reporter.{{ .name }}.{{ $tenant_name }}.cloud.nais.io"
      {{ end }}
    description: "Allow access to the Policy Reporter API"
    ignoreKind:
      - "onprem"
      - "legacy"
      - "tenant"

  policy-reporter.networkPolicy.egress:
    template: |
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .Env.apiserver_endpoint }}/32"
    description: "Allow access to the Kubernetes API server"

  policy-reporter.ui.ingress.hosts:
    template: |
      {{ if eq .Kind "management" }}
      - host: "policy-reporter-ui.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ else }}
      - host: "policy-reporter-ui.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ end }}
    description: "Allow access to the Policy Reporter API"
    ignoreKind:
      - "onprem"
      - "legacy"
      - "tenant"

  policy-reporter.kyvernoPlugin.ingress.hosts:
    template: |
      {{ if eq .Kind "management" }}
      - host: "policy-reporter-kyverno-plugin.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ else }}
      - host: "policy-reporter-kyverno-plugin.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ end }}
    description: "Allow access to the kyverno plugin API"

  policy-reporter.ingress.hosts:
    template: |
      {{ if eq .Kind "management" }}
      - host: "policy-reporter.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ else }}
      - host: "policy-reporter.{{.Env.name}}.{{.Tenant.Name}}.cloud.nais.io"
        paths:
          - path: "/"
            pathType: "ImplementationSpecific"
      {{ end }}
    description: "Allow access to the Policy Reporter API"

  policy-reporter.kyvernoPlugin.networkPolicy.egress:
    template: |
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .Env.apiserver_endpoint }}/32"
    description: "Allow access to the Kubernetes API server"