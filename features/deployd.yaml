chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/deployd
source: https://github.com/nais/helm-charts/tree/main/charts/deployd
version: 0.2.0
description: "Retrieves deployment instructions from hookd and deploys to cluster"
environmentKinds:
  - "tenant"
  - "onprem"
  - "legacy"
dependsOn:
  - allOf:
      - "nais-roles"
      - "nais-crds"
rolloutSource:
  - org: nais
    repo: deploy
mapping:
  preSharedKey:
    value: "{{.Env.deployd_pre_shared_key}}"
    displayName: deployd pre-shared key
    description: "API-key used to communicate with hookd"
  cluster:
    value: "{{.Env.name}}"
  hookdHost:
    value: "deploy.{{.Tenant.Name}}.cloud.nais.io"
config:
  preSharedKey:
    type: string
    secret: true
    description: "API-key used to communicate with hookd"
    displayName: deployd pre-shared key
  hookdHost:
    type: string
    description: "Host for hookd"
    displayName: hookd host
  image.repository:
    type: string
  image.imagePullPolicy:
    type: string
  image.tag:
    type: string
  extraEnv.HTTPS_PROXY:
    type: string
    displayName: HTTPS proxy
    ignoreKind:
      - "tenant"
  extraEnv.NO_PROXY:
    type: string
    displayName: NO_PROXY
    ignoreKind:
      - "tenant"
  deploymentEventRelays.image.tag:
    type: string
  deploymentEventRelays.influxdb.password:
    description: "Influx DB password for deployment metrics"
    displayName: InfluxDB password
    secret: true
    type: string
  caBundle:
    displayName: Enable CA bundle
    description: Mounts NAV CA bundle
    type: bool
