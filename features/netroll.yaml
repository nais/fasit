chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/netroll
source: https://github.com/nais/helm-charts/tree/main/charts/netroll
version: 0.0.1
description: "Monitors SQLInstance objects and creates network policies to allow egress traffic from application"
environmentKinds:
  - "tenant"
  - "management"
config:
  image.tag:
    type: string
    displayName: "Image tag"
mapping:
  apiserverIP:
    value: "{{ .Env.apiserver_endpoint }}"
    displayName: "API server IP"
