chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/hookd
source: https://github.com/nais/helm-charts/tree/main/charts/hookd
version: 0.0.1
environmentKinds:
  - "management"
dependsOn:
  - "console"
mapping:
  hookd.database.instance:
    value: "{{.Management.hookd_database_instance}}"
    displayName: "Database instance"
  hookd.database.user:
    value: "{{.Management.hookd_database_user}}"
    displayName: "Database user"
  hookd.database.name:
    value: "{{.Management.hookd_database_name}}"
    displayName: "Database name"
  hookd.googleServiceAccountEmail:
    value: "{{.Management.hookd_google_service_account_email}}"
    displayName: "Google service account"
    description: "The service account email that is used to access the postgres-database, set up by terraform."
  ingress.host:
    value: "deploy.{{.Tenant.Name}}.cloud.nais.io"
    displayName: "Ingress URL"
  frontendPreSharedKey:
    value: "{{.Management.hookd_frontend_pre_shared_key}}"
    displayName: "hookd frontend pre-shared key"
    description: "The pre-shared key used to authenticate the hookd frontend"
  frontend.cookieKey:
    value: "{{.Management.hookd_frontend_cookie_key}}"
    displayName: "hookd frontend cookie key"
  hookd.database.encryptionKey:
    value: "{{.Management.hookd_database_encryption_key}}"
    description: "Database encryption key used to encrypt deploy api keys"
  hookd.consoleAPIKey:
    value: "{{.Management.hookd_console_api_key}}"
    displayName: Console API-key
    description: "API-key used to get groups from console"
config:
  hookd.image.repository:
    type: string
  hookd.image.imagePullPolicy:
    type: string
  hookd.image.tag:
    type: string
  googleClient.id:
    type: string
    description: Google OAuth 2.0 Client ID, see https://handbook.nais.io/technical/tenant-setup/#set-up-oauth-client
  googleClient.secret:
    type: string
    description: Google OAuth 2.0 Client Secret, see https://handbook.nais.io/technical/tenant-setup/#set-up-oauth-client
    secret: true
  frontend.image.repository:
    type: string
  frontend.image.imagePullPolicy:
    type: string
  frontend.image.tag:
    type: string
