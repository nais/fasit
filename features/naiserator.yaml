chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/naiserator
source: https://github.com/nais/naiserator/tree/master/charts
version: 0.1.1
repo: ""
environmentKinds:
  - "tenant"
dependsOn:
  - "nais-crds"
config:
  imageTag:
    type: string
  naiserator.kafka.enabled:
    type: bool
  naiserator.leader-election.image:
    type: string
  naiserator.features.azurerator:
    type: bool
  naiserator.features.cilium:
    type: bool
  naiserator.features.digdirator:
    type: bool
  naiserator.features.jwker:
    type: bool
  naiserator.features.kafkarator:
    type: bool
mapping:
  naiserator.cluster-name:
    value: "{{.Env.name}}"
    displayName: "Cluster name"
  naiserator.google-project-id:
    value: "{{.Env.project_id}}"
    displayName: "Google project ID"
